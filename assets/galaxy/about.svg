<rect class="ac run" x="0" y="54.5" width="893" height="2" clip-path="url(#about-key)" style="animation:run 1000ms cubic-bezier(.77,0,.175,1) 1044ms both"/>
<circle class="spin" cx="827" cy="29" r="6" pathLength="1" stroke-dasharray=".62 .38" style="animation:spin 640ms linear 1044ms 1.17"/>
<path class="tick" d="M821 28l3.5 3.5l7 -7" style="animation:pop 360ms cubic-bezier(.23,1,.32,1) 1794ms both"/>
<text x="871" y="34" font-size="13" textLength="31.2" class="mu" text-anchor="end" style="animation:in 360ms cubic-bezier(.23,1,.32,1) 1854ms both">done</text>
</g>
</svg>
