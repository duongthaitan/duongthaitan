64 14.1%, 0.64 14.7%, 0.68 14.7%, 0.68 15.4%, 0.71 15.4%, 0.71 16%, 0.75 16%, 0.75 16.7%, 0.79 16.7%, 0.79 17.3%, 0.82 17.3%, 0.82 18%, 0.86 18%, 0.86 18.6%, 0.89 18.6%, 0.89 19.3%, 0.93 19.3%, 0.93 19.9%, 0.96 19.9%, 0.96 20.6%, 1 20.6%, 1 100%) 0ms infinite alternate both,vanish 6500ms linear(0, 0 25.5%, 1 27.3%, 1 100%) 0ms infinite alternate both"/>
