<style>.ty1{animation:ch 6500ms linear(0, 0 var(--s), 1 var(--s), 1 100%) 0ms infinite alternate both}</style><text x="76" y="34" font-size="15" textLength="117" class="fg"><tspan class="ty1" style="--s:3.1%">l</tspan><tspan class="ty1" style="--s:3.8%">s</tspan> <tspan class="ty1" style="--s:5%">~</tspan><tspan class="ty1" style="--s:5.7%">/</tspan><tspan class="ty1" style="--s:6.3%">p</tspan><tspan class="ty1" style="--s:7%">r</tspan><tspan class="ty1" style="--s:7.6%">o</tspan><tspan class="ty1" style="--s:8.3%">j</tspan><tspan class="ty1" style="--s:8.9%">e</tspan><tspan class="ty1" style="--s:9.6%">c</tspan><tspan class="ty1" style="--s:10.2%">t</tspan><tspan class="ty1" style="--s:10.9%">s</tspan></text><rect class="ac mv transient" x="77" y="21.7" width="7.5" height="15.3" rx="1" style="--d:117px;animation:in 6500ms linear(0, 0 2.5%, 1 2.5%, 1 100%) 0ms infinite alternate both,type 6500ms linear(0, 0 2.5%, 0 3.1%, 0.08 3.1%, 0.08 3.8%, 0.15 3.8%, 0.15 4.4%, 0.23 4.4%, 0.23 5%, 0.31 5%, 0.31 5.7%, 0.38 5.7%, 0.38 6.3%, 0.46 6.3%, 0.46 7%, 0.54 7%, 0.54 7.6%, 0.62 7.6%, 0.62 8.3%, 0.69 8.3%, 0.69 8.9%, 0.77 8.9%, 0.77 9.6%, 0.85 9.6%, 0.85 10.2%, 0.92 10.2%, 0.92 10.9%, 1 10.9%, 1 100%) 0ms infinite alternate both,vanish 6500ms linear(0, 0 15.8%, 1 17.6%, 1 100%) 0ms infinite alternate both"/>
<rect class="ac run" x="0" y="54.5" width="893" height="2" clip-path="url(#selected-work-key)" style="animation:grow 6500ms linear(0, 0 16.7%, 0.04 19.3%, 0.22 21.3%, 0.57 22.4%, 1 28.2%, 1 100%) 0ms infinite alternate both,showw 6500ms linear(0, 0 16.7%, 1 16.7%, 1 32.1%, 0 32.1%, 0 100%) 0ms infinite alternate both"/>
<circle class="spin" cx="827" cy="29" r="6" pathLength="1" stroke-dasharray=".62 .38" style="animation:showw 6500ms linear(0, 0 16.7%, 1 16.7%, 1 28.2%, 0 28.2%, 0 100%) 0ms infinite alternate both,rot 640ms linear 0ms infinite"/>
<path class="tick" d="M821 28l3.5 3.5l7 -7" style="animation:pop 6500ms linear(0, 0 28.2%, 0.32 28.7%, 0.66 29.3%, 0.91 30.3%, 1 33.8%, 1 100%) 0ms infinite alternate both"/>
<text x="871" y="34" font-size="13" textLength="31.2" class="mu" text-anchor="end" style="animation:in 6500ms linear(0, 0 29.2%, 0.32 29.6%, 0.66 30.2%, 0.91 31.2%, 1 34.7%, 1 100%) 0ms infinite alternate both">done</text>
</g>
</svg>
