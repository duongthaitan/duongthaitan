        <path d="M637 93 684 70 731 93 681 117Z" fill="url(#work-top)" stroke="#b5c6e4" stroke-width=".9"/>
        <path d="M637 93 681 117 681 159 637 135Z" fill="url(#work-left)" stroke="#7f9cc6" stroke-width=".8"/>
        <path d="M681 117 731 93 731 133 681 159Z" fill="url(#work-right)" stroke="#7c82b0" stroke-width=".8"/>
        <path d="M653 85 699 108M669 78 716 101M653 102 700 78M668 110 716 86" fill="none" stroke="#e8eaf8" stroke-width=".7" stroke-opacity=".35"/>
        <path d="M652 101V143M667 109V151M637 107 681 131M637 121 681 145" fill="none" stroke="#a4c3e2" stroke-width=".7" stroke-opacity=".32"/>
        <path d="M698 109V151M715 101V141M681 131 731 107M681 145 731 120" fill="none" stroke="#aaa3d7" stroke-width=".7" stroke-opacity=".24"/>
        <path d="M637 93 684 70 731 93M637 93 681 117V159" fill="none" stroke="#e0e6f8" stroke-width="1.1" stroke-opacity=".8"/>
        <circle cx="637" cy="93" r="2" fill="#f1edff"/><circle cx="684" cy="70" r="1.5" fill="#e4e4fb"/>
      </g>
      <path d="M600 171C665 186 792 159 840 113" fill="none" stroke="#c4b5df" stroke-opacity=".21" stroke-width=".8"/>
      <circle cx="820" cy="131" r="2" fill="#cdb5e4"/>
    </g>
    <text x="40" y="39" class="label secondary" font-size="10">SECTOR 03 / WORK</text>
    <text x="38" y="104" font-size="39" font-weight="650" letter-spacing="-1">Selected work</text>
    <text x="40" y="137" class="secondary" font-size="15">Ideas, given dimension.</text>
    <path class="decor" d="M40 164H70" stroke="#aeabe5" stroke-width="1.5"/>
