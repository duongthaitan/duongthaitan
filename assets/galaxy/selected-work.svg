<g style="animation:pressd 6500ms linear(0, 0 13.94%, 1 15.63%, 0 18.55%, 0 100%) 0ms infinite alternate both">
<path class="frame" d="M12 0.5H882A11.5 11.5 0 0 1 893.5 12V46A11.5 11.5 0 0 1 882 57.5H12A11.5 11.5 0 0 1 0.5 46V12A11.5 11.5 0 0 1 12 0.5Z"/>
<path class="ac" transform="translate(24 20) scale(0.0703)" d="M245 111a16 16 0 0 0-13-7h-16v-16a16 16 0 0 0-16-16h-69l-28-21a16 16 0 0 0-10-3h-53a16 16 0 0 0-16 16v144h0a8 8 0 0 0 8 8h179a8 8 0 0 0 8-5l28-86a16 16 0 0 0-2-14zm-152-47l30 22a8 8 0 0 0 5 2h72v16h-130a16 16 0 0 0-15 11l-15 44v-95zm112 136h-162l27-80h162z" style="animation:pop 6500ms linear(0, 0 0.6%, 0.32 1%, 0.66 1.7%, 0.91 2.7%, 1 6.2%, 1 100%) 0ms infinite alternate both"/>
<path class="sep" d="M50 19v20"/>
