<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="auto-title auto-desc">
  <title id="auto-title">Flight systems — Automation</title>
  <desc id="auto-desc">Interlocking golden gear rings and orbital mechanisms turn in deep space. Satellite nodes ride fixed positions on circular tracks while golden sparks mark the mesh points of the clockwork constellation.</desc>
  <defs>
    <clipPath id="auto-frame"><rect width="900" height="200" rx="16"/></clipPath>
    <radialGradient id="auto-nebula"><stop stop-color="#c9a020" stop-opacity=".28"/><stop offset=".5" stop-color="#6b4f14" stop-opacity=".12"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="auto-fire"><stop stop-color="#b86830" stop-opacity=".16"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="auto-glow"><stop stop-color="#ffd700" stop-opacity=".2"/><stop offset=".4" stop-color="#d4a017" stop-opacity=".08"/><stop offset="1" stop-color="#d4a017" stop-opacity="0"/></radialGradient>
    <radialGradient id="auto-core" cx=".3" cy=".24" r=".78"><stop stop-color="#fff8e1"/><stop offset=".25" stop-color="#ffd700"/><stop offset=".55" stop-color="#b8860b"/><stop offset=".8" stop-color="#4a3810"/><stop offset="1" stop-color="#0e0e08"/></radialGradient>
    <radialGradient id="auto-node" cx=".28" cy=".22" r=".8"><stop stop-color="#ffe8c0"/><stop offset=".3" stop-color="#d4a862"/><stop offset=".65" stop-color="#6b5530"/><stop offset="1" stop-color="#100e08"/></radialGradient>
    <linearGradient id="auto-track"><stop stop-color="#ffd700" stop-opacity=".3"/><stop offset=".5" stop-color="#d4a017" stop-opacity=".5"/><stop offset="1" stop-color="#c4762b" stop-opacity=".2"/></linearGradient>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#e6edf3}.secondary{fill:#aeb8c5}.label{font-family:ui-monospace,Consolas,monospace;letter-spacing:1.6px}.clockwork{transform-origin:710px 100px;animation:auto-settle 3.8s ease-out 1}.gear{stroke-dasharray:400;stroke-dashoffset:0;animation:auto-trace 3.5s ease-out 1}@keyframes auto-settle{from{transform:rotate(-4deg) scale(.94)}to{transform:rotate(0) scale(1)}}@keyframes auto-trace{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.clockwork,.gear{animation:none}}@media(forced-colors:active){.decor{display:none}.background{fill:Canvas}.border{stroke:CanvasText}text,.secondary{fill:CanvasText}}
    </style>
  </defs>
  <g clip-path="url(#auto-frame)">
    <rect class="background" width="900" height="200" fill="#070b19"/>
    <g class="decor">
      <ellipse cx="700" cy="100" rx="310" ry="168" fill="url(#auto-nebula)" transform="rotate(-10 700 100)"/>
      <ellipse cx="830" cy="50" rx="190" ry="90" fill="url(#auto-fire)" transform="rotate(-20 830 50)"/>
      <ellipse cx="430" cy="175" rx="220" ry="85" fill="url(#auto-nebula)" opacity=".35"/>
      <g fill="#d4c5a0" opacity=".4">
        <circle cx="22" cy="80" r=".6"/><circle cx="68" cy="16" r=".7"/><circle cx="128" cy="66" r=".5"/><circle cx="172" cy="20" r=".6"/><circle cx="224" cy="56" r=".55"/><circle cx="270" cy="16" r=".7"/><circle cx="328" cy="60" r=".55"/><circle cx="380" cy="24" r=".65"/><circle cx="434" cy="66" r=".55"/><circle cx="476" cy="18" r=".6"/>
        <circle cx="22" cy="162" r=".6"/><circle cx="96" cy="178" r=".5"/><circle cx="164" cy="154" r=".55"/><circle cx="238" cy="180" r=".65"/><circle cx="314" cy="162" r=".55"/><circle cx="392" cy="176" r=".6"/><circle cx="462" cy="148" r=".6"/><circle cx="496" cy="100" r=".5"/>
        <circle cx="520" cy="28" r=".7"/><circle cx="556" cy="76" r=".55"/><circle cx="590" cy="14" r=".6"/><circle cx="626" cy="70" r=".5"/><circle cx="660" cy="16" r=".55"/><circle cx="706" cy="38" r=".6"/><circle cx="754" cy="18" r=".7"/><circle cx="800" cy="28" r=".55"/><circle cx="846" cy="58" r=".6"/><circle cx="878" cy="20" r=".55"/>
        <circle cx="528" cy="162" r=".55"/><circle cx="572" cy="184" r=".65"/><circle cx="644" cy="168" r=".5"/><circle cx="680" cy="186" r=".6"/><circle cx="726" cy="170" r=".5"/><circle cx="794" cy="188" r=".7"/><circle cx="842" cy="172" r=".55"/><circle cx="876" cy="136" r=".6"/>
      </g>
      <g fill="#ffe8b0"><circle cx="508" cy="64" r="1.1" opacity=".7"/><circle cx="858" cy="44" r="1.15" opacity=".8"/><circle cx="698" cy="16" r="1" opacity=".65"/><circle cx="552" cy="130" r=".9" opacity=".6"/><circle cx="828" cy="152" r="1" opacity=".7"/></g>
      <path d="M866 174v6m-3-3h6M570 40v5m-2.5-2.5h5" fill="none" stroke="#ffe8b0" stroke-opacity=".5" stroke-linecap="round"/>
      <!-- Clockwork mechanism -->
      <g class="clockwork">
        <!-- Central glow -->
        <circle cx="710" cy="100" r="60" fill="url(#auto-glow)"/>
        <!-- Gear ring tracks -->
        <circle class="gear" cx="710" cy="100" r="65" fill="none" stroke="url(#auto-track)" stroke-width="1.2"/>
        <circle class="gear" cx="710" cy="100" r="45" fill="none" stroke="url(#auto-track)" stroke-width="1" opacity=".7"/>
        <circle class="gear" cx="710" cy="100" r="85" fill="none" stroke="#c9a455" stroke-opacity=".18" stroke-width=".8"/>
        <!-- Tilted orbital ring -->
        <ellipse cx="710" cy="100" rx="78" ry="30" transform="rotate(-22 710 100)" fill="none" stroke="#d4a017" stroke-opacity=".25" stroke-width="1.2"/>
        <ellipse cx="710" cy="100" rx="55" ry="22" transform="rotate(18 710 100)" fill="none" stroke="#c9a455" stroke-opacity=".15" stroke-width=".8"/>
        <!-- Core -->
        <circle cx="710" cy="100" r="18" fill="url(#auto-core)"/>
        <path d="M694 95A18 18 0 0 1 716 83" fill="none" stroke="#fff8e1" stroke-opacity=".6" stroke-width=".9"/>
        <!-- Gear teeth marks -->
        <g fill="none" stroke="#d4a017" stroke-opacity=".25" stroke-width="1.2" stroke-linecap="round">
          <path d="M710 35v8M710 157v8M635 100h8M777 100h8"/><path d="M657 47l5.5 5.5M758 148l5.5 5.5M657 153l5.5-5.5M758 47l5.5-5.5"/>
        </g>
        <!-- Satellite nodes on orbits -->
        <circle cx="775" cy="100" r="8" fill="url(#auto-node)"/><path d="M768 97A8 8 0 0 1 778 93" fill="none" stroke="#ffe8c0" stroke-opacity=".55" stroke-width=".6"/>
        <circle cx="645" cy="100" r="7" fill="url(#auto-node)"/><path d="M639 97A7 7 0 0 1 648 93" fill="none" stroke="#ffe8c0" stroke-opacity=".5" stroke-width=".6"/>
        <circle cx="710" cy="35" r="6" fill="url(#auto-node)"/>
        <circle cx="710" cy="165" r="5" fill="url(#auto-node)"/>
        <!-- Connection spokes -->
        <path d="M710 53V82M710 118V160M727 100H767M653 100H692" fill="none" stroke="#c9a455" stroke-opacity=".2" stroke-width=".6"/>
        <!-- Spark dots at mesh points -->
        <circle cx="748" cy="68" r="1.5" fill="#ffd700" opacity=".5"/><circle cx="672" cy="132" r="1.5" fill="#ffd700" opacity=".45"/><circle cx="748" cy="132" r="1.3" fill="#e8c170" opacity=".4"/><circle cx="672" cy="68" r="1.3" fill="#e8c170" opacity=".4"/>
      </g>
    </g>
    <text x="40" y="39" class="label secondary" font-size="10">SECTOR 06 / AUTOMATION</text>
    <text x="38" y="104" font-size="39" font-weight="650" letter-spacing="-1">Flight systems</text>
    <text x="40" y="137" class="secondary" font-size="15">Precision clockwork in orbit.</text>
    <path class="decor" d="M40 164H70" stroke="#d4a017" stroke-width="1.5"/>
  </g>
  <rect class="border" x=".5" y=".5" width="899" height="199" rx="15.5" fill="none" stroke="#8b7d3e" stroke-opacity=".23"/>
</svg>
