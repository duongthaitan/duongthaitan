<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="auto-title auto-desc">
  <title id="auto-title">Flight systems — Automation</title>
  <desc id="auto-desc">A dimensional satellite with blue photovoltaic wings, a metallic instrument body and a silver dish transmits gentle curved signals across space. A shaded blue planet rises beneath its orbit through indigo and rose nebulae.</desc>
