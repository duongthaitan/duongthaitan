<style>.ty1{animation:ch 6500ms linear(0, 0 var(--s), 1 var(--s), 1 100%) 0ms infinite alternate both}</style><text x="76" y="34" font-size="15" textLength="144" class="fg"><tspan class="ty1" style="--s:3.1%">g</tspan><tspan class="ty1" style="--s:3.8%">h</tspan> <tspan class="ty1" style="--s:5%">w</tspan><tspan class="ty1" style="--s:5.7%">o</tspan><tspan class="ty1" style="--s:6.3%">r</tspan><tspan class="ty1" style="--s:7%">k</tspan><tspan class="ty1" style="--s:7.6%">f</tspan><tspan class="ty1" style="--s:8.3%">l</tspan><tspan class="ty1" style="--s:8.9%">o</tspan><tspan class="ty1" style="--s:9.6%">w</tspan> <tspan class="ty1" style="--s:10.9%">l</tspan><tspan class="ty1" style="--s:11.5%">i</tspan><tspan class="ty1" style="--s:12.2%">s</tspan><tspan class="ty1" style="--s:12.8%">t</tspan></text><rect class="ac mv transient" x="77" y="21.7" width="7.5" height="15.3" rx="1" style="--d:144px;animation:in 6500ms linear(0, 0 2.5%, 1 2.5%, 1 100%) 0ms infinite alternate both,type 6500ms linear(0, 0 2.5%, 0 3.1%, 0.06 3.1%, 0.06 3.8%, 0.13 3.8%, 0.13 4.4%, 0.19 4.4%, 0.19 5%, 0.25 5%, 0.25 5.7%, 0.31 5.7%, 0.31 6.3%, 0.38 6.3%, 0.38 7%, 0.44 7%, 0.44 7.6%, 0.5 7.6%, 0.5 8.3%, 0.56 8.3%, 0.56 8.9%, 0.63 8.9%, 0.63 9.6%, 0.69 9.6%, 0.69 10.2%, 0.75 10.2%, 0.75 10.9%, 0.81 10.9%, 0.81 11.5%, 0.88 11.5%, 0.88 12.2%, 0.94 12.2%, 0.94 12.8%, 1 12.8%, 1 100%) 0ms infinite alternate both,vanish 6500ms linear(0, 0 17.7%, 1 19.6%, 1 100%) 0ms infinite alternate both"/>
<rect class="ac run" x="0" y="54.5" width="893" height="2" clip-path="url(#automation-key)" style="animation:grow 6500ms linear(0, 0 18.6%, 0.04 21.2%, 0.22 23.3%, 0.57 24.4%, 1 30.2%, 1 100%) 0ms infinite alternate both,showw 6500ms linear(0, 0 18.6%, 1 18.6%, 1 34%, 0 34%, 0 100%) 0ms infinite alternate both"/>
<circle class="spin" cx="827" cy="29" r="6" pathLength="1" stroke-dasharray=".62 .38" style="animation:showw 6500ms linear(0, 0 18.6%, 1 18.6%, 1 30.2%, 0 30.2%, 0 100%) 0ms infinite alternate both,rot 640ms linear 0ms infinite"/>
<path class="tick" d="M821 28l3.5 3.5l7 -7" style="animation:pop 6500ms linear(0, 0 30.2%, 0.32 30.6%, 0.66 31.2%, 0.91 32.3%, 1 35.7%, 1 100%) 0ms infinite alternate both"/>
<text x="871" y="34" font-size="13" textLength="31.2" class="mu" text-anchor="end" style="animation:in 6500ms linear(0, 0 31.1%, 0.32 31.5%, 0.66 32.2%, 0.91 33.2%, 1 36.6%, 1 100%) 0ms infinite alternate both">done</text>
</g>
</svg>
