    <linearGradient id="auto-gold" x1="675" y1="80" x2="721" y2="134" gradientUnits="userSpaceOnUse"><stop stop-color="#e3d6c9"/><stop offset=".28" stop-color="#b9a594"/><stop offset=".58" stop-color="#897581"/><stop offset="1" stop-color="#544a66"/></linearGradient>
    <linearGradient id="auto-side"><stop stop-color="#77788f"/><stop offset="1" stop-color="#2b3049"/></linearGradient>
