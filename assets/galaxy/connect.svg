<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="connect-title connect-desc">
  <title id="connect-title">Open a channel — Connect</title>
  <desc id="connect-desc">A rose-lit ringed planet hangs low above a sweeping blue cosmic horizon. Its tilted, layered rings catch the light, a small pearl moon shines nearby, and a delicate orbital arc crosses violet nebulae and distant stars.</desc>
  <defs>
    <clipPath id="connect-frame"><rect width="900" height="200" rx="16"/></clipPath>
    <clipPath id="connect-globe"><circle cx="736" cy="82" r="44"/></clipPath>
    <radialGradient id="connect-nebula"><stop stop-color="#6550b9" stop-opacity=".35"/><stop offset=".5" stop-color="#3d2c75" stop-opacity=".16"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="connect-rose"><stop stop-color="#c75f9f" stop-opacity=".28"/><stop offset=".49" stop-color="#823d82" stop-opacity=".12"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="connect-air"><stop offset=".75" stop-color="#ddbbec" stop-opacity="0"/><stop offset=".82" stop-color="#ccadee" stop-opacity=".21"/><stop offset="1" stop-color="#b5a2ea" stop-opacity="0"/></radialGradient>
    <radialGradient id="connect-surface" cx=".27" cy=".22" r=".84"><stop stop-color="#fae5e2"/><stop offset=".24" stop-color="#d9b6ca"/><stop offset=".5" stop-color="#aa80a3"/><stop offset=".76" stop-color="#514465"/><stop offset="1" stop-color="#13182c"/></radialGradient>
    <radialGradient id="connect-night" cx=".17" cy=".18" r=".94"><stop offset=".28" stop-color="#070b19" stop-opacity="0"/><stop offset=".65" stop-color="#070b19" stop-opacity=".23"/><stop offset="1" stop-color="#070b19" stop-opacity=".95"/></radialGradient>
    <linearGradient id="connect-rings" x1="650" y1="67" x2="824" y2="107" gradientUnits="userSpaceOnUse"><stop stop-color="#d7c2e0"/><stop offset=".25" stop-color="#f0dae9"/><stop offset=".62" stop-color="#9e87b8"/><stop offset="1" stop-color="#d5bbda"/></linearGradient>
    <radialGradient id="connect-moon" cx=".25" cy=".2" r=".82"><stop stop-color="#f4ece8"/><stop offset=".3" stop-color="#c3c3d8"/><stop offset=".64" stop-color="#787a9b"/><stop offset="1" stop-color="#161d34"/></radialGradient>
    <radialGradient id="connect-dawn"><stop stop-color="#b1b9fa" stop-opacity=".3"/><stop offset=".38" stop-color="#7b82d4" stop-opacity=".13"/><stop offset="1" stop-color="#6d79c6" stop-opacity="0"/></radialGradient>
    <radialGradient id="connect-land" cx=".59" cy="0" r=".84"><stop stop-color="#3b4e78"/><stop offset=".17" stop-color="#1a2947"/><stop offset=".47" stop-color="#0e182d"/><stop offset="1" stop-color="#070d1d"/></radialGradient>
    <linearGradient id="connect-horizon" x1="461" y1="156" x2="919" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#8299df" stop-opacity="0"/><stop offset=".3" stop-color="#a2b6f3" stop-opacity=".7"/><stop offset=".61" stop-color="#e0dcff"/><stop offset="1" stop-color="#a4a8e5" stop-opacity=".35"/></linearGradient>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#e6edf3}.secondary{fill:#aeb8c5}.label{font-family:ui-monospace,Consolas,monospace;letter-spacing:1.6px}.ringed-world{transform-origin:736px 82px;animation:connect-settle 3.8s ease-out 1}.nebula-settle{animation:connect-nebula 4s ease-out 1}@keyframes connect-settle{from{transform:translate(3px,3px) rotate(2deg)}to{transform:translate(0,0) rotate(0)}}@keyframes connect-nebula{from{transform:translate(6px,0)}to{transform:translate(0,0)}}@media(prefers-reduced-motion:reduce){.ringed-world,.nebula-settle{animation:none}}@media(forced-colors:active){.decor{display:none}.background{fill:Canvas}.border{stroke:CanvasText}text,.secondary{fill:CanvasText}}
    </style>
  </defs>
  <g clip-path="url(#connect-frame)">
    <rect class="background" width="900" height="200" fill="#070b19"/>
    <g class="decor">
      <g class="nebula-settle">
        <ellipse cx="704" cy="107" rx="332" ry="166" fill="url(#connect-nebula)" transform="rotate(-14 704 107)"/>
        <ellipse cx="783" cy="56" rx="243" ry="103" fill="url(#connect-rose)" transform="rotate(21 783 56)"/>
        <ellipse cx="457" cy="173" rx="212" ry="103" fill="url(#connect-nebula)" opacity=".5"/>
      </g>
      <g fill="#bcc6e6" opacity=".45">
        <circle cx="22" cy="84" r=".6"/><circle cx="71" cy="19" r=".7"/><circle cx="129" cy="65" r=".5"/><circle cx="182" cy="23" r=".6"/><circle cx="239" cy="60" r=".55"/><circle cx="301" cy="17" r=".7"/><circle cx="349" cy="65" r=".6"/><circle cx="408" cy="23" r=".65"/><circle cx="454" cy="78" r=".7"/>
        <circle cx="23" cy="157" r=".65"/><circle cx="91" cy="179" r=".55"/><circle cx="161" cy="159" r=".5"/><circle cx="239" cy="186" r=".7"/><circle cx="311" cy="161" r=".6"/><circle cx="381" cy="181" r=".65"/><circle cx="444" cy="146" r=".6"/><circle cx="486" cy="175" r=".55"/>
        <circle cx="494" cy="32" r=".7"/><circle cx="532" cy="88" r=".55"/><circle cx="569" cy="17" r=".65"/><circle cx="610" cy="69" r=".6"/><circle cx="652" cy="20" r=".7"/><circle cx="686" cy="48" r=".5"/><circle cx="723" cy="16" r=".65"/><circle cx="779" cy="24" r=".6"/><circle cx="825" cy="17" r=".55"/><circle cx="875" cy="62" r=".7"/>
        <circle cx="522" cy="140" r=".55"/><circle cx="558" cy="162" r=".7"/><circle cx="597" cy="112" r=".6"/><circle cx="629" cy="137" r=".55"/><circle cx="672" cy="112" r=".65"/><circle cx="783" cy="125" r=".5"/><circle cx="816" cy="95" r=".65"/><circle cx="848" cy="134" r=".6"/><circle cx="885" cy="113" r=".6"/>
        <circle cx="547" cy="49" r=".5"/><circle cx="580" cy="74" r=".5"/><circle cx="656" cy="76" r=".55"/><circle cx="794" cy="56" r=".55"/><circle cx="850" cy="81" r=".5"/><circle cx="468" cy="110" r=".5"/>
      </g>
      <g fill="#e6edf3"><circle cx="477" cy="52" r="1.1" opacity=".8"/><circle cx="638" cy="40" r="1.2"/><circle cx="853" cy="31" r="1.1" opacity=".8"/><circle cx="576" cy="129" r="1" opacity=".7"/><circle cx="840" cy="108" r=".95" opacity=".75"/><circle cx="414" cy="120" r=".9" opacity=".6"/></g>
      <path d="M559 103v7m-3.5-3.5h7M878 154v6m-3-3h6" fill="none" stroke="#d8def6" stroke-opacity=".6" stroke-linecap="round"/>
      <path d="M499 151C601 28 796 3 925 72" fill="none" stroke="#b8abd5" stroke-opacity=".2" stroke-width=".8"/>
      <ellipse cx="738" cy="82" rx="133" ry="53" transform="rotate(-14 738 82)" fill="none" stroke="#b8a9cf" stroke-opacity=".13" stroke-width=".8"/>
      <g class="ringed-world">
        <circle cx="736" cy="82" r="54" fill="url(#connect-air)"/>
        <g transform="rotate(18 736 82)" fill="none" stroke="url(#connect-rings)">
          <ellipse cx="736" cy="82" rx="91" ry="24" stroke-width=".9" opacity=".6"/>
          <ellipse cx="736" cy="82" rx="85" ry="22" stroke-width="7" opacity=".58"/>
          <ellipse cx="736" cy="82" rx="79" ry="20" stroke-width="1.8" opacity=".5"/>
          <ellipse cx="736" cy="82" rx="74" ry="18" stroke-width="2" opacity=".35"/>
        </g>
        <circle cx="736" cy="82" r="44" fill="url(#connect-surface)"/>
        <g clip-path="url(#connect-globe)" fill="none">
          <path d="M689 66C716 55 742 82 782 72" stroke="#ffe1e8" stroke-width="4" stroke-opacity=".22"/>
          <path d="M689 80C714 69 741 92 783 83" stroke="#694973" stroke-width="3" stroke-opacity=".27"/>
          <path d="M692 94C718 85 744 107 781 96" stroke="#e9bfd7" stroke-width="6" stroke-opacity=".17"/>
          <path d="M697 105C722 99 745 116 774 108" stroke="#cda8c8" stroke-width="1.5" stroke-opacity=".2"/>
          <path d="M689 83C710 107 750 113 782 90" stroke="#211c35" stroke-width="5" stroke-opacity=".3"/>
          <circle cx="736" cy="82" r="44" fill="url(#connect-night)"/>
        </g>
        <path d="M694 73A44 44 0 0 1 749 40" fill="none" stroke="#f9e1eb" stroke-width="1" stroke-opacity=".85"/>
        <g transform="rotate(18 736 82)" fill="none" stroke="url(#connect-rings)">
          <path d="M645 82A91 24 0 0 0 827 82" stroke-width=".9" opacity=".85"/>
          <path d="M651 82A85 22 0 0 0 821 82" stroke-width="7" opacity=".94"/>
          <path d="M657 82A79 20 0 0 0 815 82" stroke-width="1.8" opacity=".9"/>
          <path d="M662 82A74 18 0 0 0 810 82" stroke-width="2" opacity=".6"/>
          <path d="M650 86C663 101 694 107 721 106" stroke="#f5dfed" stroke-width=".7" opacity=".8"/>
        </g>
      </g>
      <circle cx="839" cy="61" r="9" fill="url(#connect-moon)"/>
      <path d="M831 58A9 9 0 0 1 842 52" fill="none" stroke="#f0edf8" stroke-width=".7" stroke-opacity=".7"/>
      <circle cx="836" cy="58" r="1.6" fill="#928aa9" opacity=".4"/>
      <ellipse cx="734" cy="149" rx="229" ry="58" fill="url(#connect-dawn)"/>
      <path d="M441 227C569 140 745 116 939 162" fill="none" stroke="#8c9de6" stroke-opacity=".08" stroke-width="18"/>
      <path d="M441 227C569 140 745 116 939 162" fill="none" stroke="#a8b6f8" stroke-opacity=".15" stroke-width="6"/>
      <path d="M441 227C569 140 745 116 939 162L947 271H430Z" fill="url(#connect-land)"/>
      <path d="M441 227C569 140 745 116 939 162" fill="none" stroke="url(#connect-horizon)" stroke-width="1.5"/>
      <path d="M563 190C658 153 785 151 896 178M644 191C731 173 817 178 866 190" fill="none" stroke="#a3add5" stroke-width=".8" stroke-opacity=".12"/>
      <path d="M685 179 706 177M765 174 781 175M819 186l11 2" fill="none" stroke="#bbc5e5" stroke-opacity=".18" stroke-width=".8" stroke-linecap="round"/>
    </g>
    <text x="40" y="39" class="label secondary" font-size="10">SECTOR 07 / CONNECT</text>
    <text x="38" y="104" font-size="39" font-weight="650" letter-spacing="-1">Open a channel</text>
    <text x="40" y="137" class="secondary" font-size="15">Good ideas start with a signal.</text>
    <path class="decor" d="M40 164H70" stroke="#aeabe5" stroke-width="1.5"/>
  </g>
  <rect class="border" x=".5" y=".5" width="899" height="199" rx="15.5" fill="none" stroke="#8390b7" stroke-opacity=".23"/>
</svg>
