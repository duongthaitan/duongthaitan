<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="connect-title connect-desc">
  <title id="connect-title">Open a channel — Connect</title>
  <desc id="connect-desc">A circular portal ringed with golden fire hangs in deep space. Warm amber light radiates from the gateway while stars shine through the opening, inviting connection beyond the frontier.</desc>
  <defs>
    <clipPath id="connect-frame"><rect width="900" height="200" rx="16"/></clipPath>
    <radialGradient id="connect-nebula"><stop stop-color="#c9a020" stop-opacity=".3"/><stop offset=".5" stop-color="#6b4f14" stop-opacity=".13"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="connect-fire"><stop stop-color="#c4762b" stop-opacity=".2"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="connect-glow"><stop stop-color="#ffd700" stop-opacity=".25"/><stop offset=".35" stop-color="#d4a017" stop-opacity=".12"/><stop offset="1" stop-color="#d4a017" stop-opacity="0"/></radialGradient>
    <radialGradient id="connect-inner"><stop stop-color="#1a1810" stop-opacity=".3"/><stop offset=".4" stop-color="#0a0b14" stop-opacity=".6"/><stop offset="1" stop-color="#060810"/></radialGradient>
    <radialGradient id="connect-flare" cx=".3" cy=".25" r=".78"><stop stop-color="#fff8e1" stop-opacity=".9"/><stop offset=".2" stop-color="#ffd700" stop-opacity=".5"/><stop offset=".5" stop-color="#d4a017" stop-opacity=".15"/><stop offset="1" stop-color="#d4a017" stop-opacity="0"/></radialGradient>
    <linearGradient id="connect-rim"><stop stop-color="#ffd700" stop-opacity=".8"/><stop offset=".3" stop-color="#e8c170" stop-opacity=".9"/><stop offset=".6" stop-color="#c4762b" stop-opacity=".7"/><stop offset="1" stop-color="#ffd700" stop-opacity=".5"/></linearGradient>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#e6edf3}.secondary{fill:#aeb8c5}.label{font-family:ui-monospace,Consolas,monospace;letter-spacing:1.6px}.portal{transform-origin:715px 100px;animation:connect-pulse 6s ease-in-out 200}.halo{transform-origin:715px 100px;animation:connect-halo 4s ease-in-out 200}.neb{transform-origin:715px 95px;animation:connect-drift 18s ease-in-out 200}.twk{transform-origin:692px 60px;animation:connect-twk 3.5s ease-in-out 200}@keyframes connect-pulse{0%,100%{transform:scale(.94);opacity:.85}50%{transform:scale(1.04);opacity:1}}@keyframes connect-halo{0%,100%{transform:scale(.9);opacity:.3}50%{transform:scale(1.15);opacity:.7}}@keyframes connect-drift{0%,100%{transform:rotate(-12deg) translate(0,0)}50%{transform:rotate(-12deg) translate(10px,-6px)}}@keyframes connect-twk{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.25)}}@media(prefers-reduced-motion:reduce){.portal,.halo,.neb,.twk{animation:none}}@media(forced-colors:active){.decor{display:none}.background{fill:Canvas}.border{stroke:CanvasText}text,.secondary{fill:CanvasText}}
    </style>
  </defs>
  <g clip-path="url(#connect-frame)">
    <rect class="background" width="900" height="200" fill="#070b19"/>
    <g class="decor">
      <ellipse class="neb" cx="715" cy="95" rx="320" ry="175" fill="url(#connect-nebula)" transform="rotate(-12 715 95)"/>
      <ellipse cx="810" cy="160" rx="210" ry="95" fill="url(#connect-fire)" transform="rotate(-26 810 160)"/>
      <ellipse cx="420" cy="-15" rx="200" ry="108" fill="url(#connect-nebula)" opacity=".4"/>
      <g fill="#d4c5a0" opacity=".4">
        <circle cx="20" cy="72" r=".6"/><circle cx="64" cy="16" r=".7"/><circle cx="122" cy="64" r=".5"/><circle cx="166" cy="20" r=".6"/><circle cx="218" cy="54" r=".55"/><circle cx="264" cy="16" r=".75"/><circle cx="322" cy="60" r=".6"/><circle cx="376" cy="22" r=".5"/><circle cx="428" cy="66" r=".55"/><circle cx="474" cy="16" r=".6"/>
        <circle cx="22" cy="156" r=".65"/><circle cx="90" cy="174" r=".5"/><circle cx="158" cy="150" r=".55"/><circle cx="232" cy="176" r=".7"/><circle cx="308" cy="158" r=".55"/><circle cx="388" cy="172" r=".6"/><circle cx="458" cy="144" r=".65"/><circle cx="492" cy="96" r=".5"/>
        <circle cx="516" cy="26" r=".7"/><circle cx="552" cy="76" r=".55"/><circle cx="586" cy="14" r=".6"/><circle cx="622" cy="68" r=".5"/><circle cx="656" cy="16" r=".55"/><circle cx="702" cy="34" r=".6"/><circle cx="750" cy="16" r=".7"/><circle cx="796" cy="28" r=".55"/><circle cx="842" cy="56" r=".6"/><circle cx="874" cy="20" r=".55"/>
        <circle cx="522" cy="158" r=".55"/><circle cx="568" cy="180" r=".65"/><circle cx="640" cy="164" r=".5"/><circle cx="676" cy="182" r=".6"/><circle cx="722" cy="166" r=".5"/><circle cx="790" cy="184" r=".7"/><circle cx="838" cy="168" r=".55"/><circle cx="874" cy="134" r=".6"/>
      </g>
      <g class="twk" fill="#ffe8b0"><circle cx="502" cy="60" r="1.1" opacity=".7"/><circle cx="852" cy="40" r="1.15" opacity=".8"/><circle cx="692" cy="14" r="1" opacity=".65"/><circle cx="548" cy="126" r=".9" opacity=".6"/><circle cx="822" cy="148" r="1" opacity=".7"/></g>
      <path d="M862 168v6m-3-3h6M566 36v5m-2.5-2.5h5" fill="none" stroke="#ffe8b0" stroke-opacity=".5" stroke-linecap="round"/>
      <!-- Portal gateway -->
      <g class="portal">
        <!-- Outer halo glow -->
        <circle class="halo" cx="715" cy="100" r="85" fill="url(#connect-glow)"/>
        <!-- Fire rim — multiple concentric rings -->
        <circle cx="715" cy="100" r="55" fill="none" stroke="url(#connect-rim)" stroke-width="4" opacity=".6"/>
        <circle cx="715" cy="100" r="50" fill="none" stroke="url(#connect-rim)" stroke-width="8" opacity=".4"/>
        <circle cx="715" cy="100" r="46" fill="none" stroke="#ffd700" stroke-opacity=".25" stroke-width="1"/>
        <circle cx="715" cy="100" r="58" fill="none" stroke="#d4a017" stroke-opacity=".15" stroke-width=".8"/>
        <!-- Portal interior — deep space visible through -->
        <circle cx="715" cy="100" r="42" fill="url(#connect-inner)"/>
        <!-- Stars visible through the portal -->
        <g fill="#ffe8b0" opacity=".7">
          <circle cx="705" cy="88" r="1.2"/><circle cx="725" cy="95" r=".9"/><circle cx="710" cy="108" r="1"/><circle cx="730" cy="85" r=".7"/><circle cx="698" cy="102" r=".8"/><circle cx="720" cy="112" r=".6"/><circle cx="714" cy="78" r=".5"/>
        </g>
        <!-- Flare accents on rim -->
        <circle cx="670" cy="72" r="5" fill="url(#connect-flare)" opacity=".6"/>
        <circle cx="758" cy="128" r="4" fill="url(#connect-flare)" opacity=".5"/>
        <circle cx="760" cy="72" r="3.5" fill="url(#connect-flare)" opacity=".4"/>
        <circle cx="670" cy="128" r="3" fill="url(#connect-flare)" opacity=".35"/>
        <!-- Radiating lines -->
        <g fill="none" stroke="#ffd700" stroke-opacity=".12" stroke-width=".6">
          <path d="M715 38V55M715 145V162M648 100H660M770 100H782"/><path d="M668 53L676 61M756 139L764 147M668 147L676 139M756 53L764 61"/>
        </g>
      </g>
      <!-- Edge structure hint -->
      <path d="M855 215A98 98 0 0 1 938 132" fill="none" stroke="#8b7020" stroke-opacity=".08" stroke-width="10"/>
      <path d="M855 215A98 98 0 0 1 938 132L952 225Z" fill="#100e08" stroke="#a88a30" stroke-opacity=".22"/>
    </g>
    <text x="40" y="39" class="label secondary" font-size="10">SECTOR 07 / CONNECT</text>
    <text x="38" y="104" font-size="39" font-weight="650" letter-spacing="-1">Open a channel</text>
    <text x="40" y="137" class="secondary" font-size="15">Step through the fire.</text>
    <path class="decor" d="M40 164H70" stroke="#d4a017" stroke-width="1.5"/>
  </g>
  <rect class="border" x=".5" y=".5" width="899" height="199" rx="15.5" fill="none" stroke="#8b7d3e" stroke-opacity=".23"/>
</svg>
