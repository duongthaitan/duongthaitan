<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="connect-title connect-desc">
  <title id="connect-title">Console panel — Connect</title>
  <desc id="connect-desc">A DevTools Console panel showing contact information as a console.log output, displaying GitHub, LinkedIn, and Instagram links in a JavaScript object format.</desc>
  <defs>
    <clipPath id="connect-frame"><rect width="900" height="200" rx="8"/></clipPath>
    <style>
      text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;fill:#d4d4d4}
      .tab{font-size:11px;fill:#8b949e}.tab-on{font-size:11px;fill:#e6edf3}
      .pr{fill:#569cd6}.fn{fill:#dcdcaa}.vr{fill:#9cdcfe}.st{fill:#ce9178}
      @media(prefers-reduced-motion:reduce){.cur{display:none}}
      @media(forced-colors:active){.bg{fill:Canvas}.bdr{stroke:CanvasText}text,.tab,.tab-on,.pr,.fn,.vr,.st{fill:CanvasText}}
    </style>
  </defs>
  <g clip-path="url(#connect-frame)">
    <rect class="bg" width="900" height="200" fill="#0d1117"/>
    <rect width="900" height="28" fill="#161b22"/>
    <rect x="76" y="0" width="64" height="28" fill="#0d1117"/>
    <text x="12" y="18" class="tab">Elements</text>
    <text x="88" y="18" class="tab-on">Console</text>
    <text x="148" y="18" class="tab">Sources</text>
    <text x="210" y="18" class="tab">Network</text>
    <text x="272" y="18" class="tab">Performance</text>
    <text x="362" y="18" class="tab">Application</text>
    <line x1="0" y1="28" x2="900" y2="28" stroke="#30363d"/>
    <rect x="76" y="27" width="64" height="2" fill="#0078d4"/>
    <!-- Console command -->
    <text x="20" y="56"><tspan class="pr">&gt; </tspan><tspan class="fn">console.log</tspan><tspan>(</tspan><tspan class="vr">links</tspan><tspan>)</tspan></text>
    <!-- Output object -->
    <text x="20" y="80">{</text>
    <text x="36" y="100"><tspan class="vr">github</tspan><tspan>: </tspan><tspan class="st">"github.com/duongthaitan"</tspan><tspan>,</tspan></text>
    <text x="36" y="120"><tspan class="vr">linkedin</tspan><tspan>: </tspan><tspan class="st">"linkedin.com/in/duongthaitan"</tspan><tspan>,</tspan></text>
    <text x="36" y="140"><tspan class="vr">instagram</tspan><tspan>: </tspan><tspan class="st">"instagram.com/thaitan.duong_"</tspan></text>
    <text x="20" y="160">}</text>
    <!-- Prompt -->
    <text x="20" y="184"><tspan class="pr">&gt; </tspan></text>
    <rect class="cur" x="34" y="172" width="7" height="14" fill="#aeafad"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <rect class="bdr" x=".5" y=".5" width="899" height="199" rx="7.5" fill="none" stroke="#30363d"/>
</svg>
