<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="cert-title cert-desc">
  <title id="cert-title">Learning coordinates — Credentials</title>
  <desc id="cert-desc">A golden zodiac seal bearing the Leo symbol floats amid amber star clusters. Warm orbital arcs trace learning paths through a deep starfield while a scroll-like silhouette anchors the lower right corner.</desc>
  <defs>
    <clipPath id="cert-frame"><rect width="900" height="200" rx="16"/></clipPath>
    <radialGradient id="cert-nebula"><stop stop-color="#c9a020" stop-opacity=".3"/><stop offset=".5" stop-color="#6b4f14" stop-opacity=".13"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="cert-fire"><stop stop-color="#b86830" stop-opacity=".18"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="cert-glow"><stop stop-color="#ffd700" stop-opacity=".24"/><stop offset=".4" stop-color="#d4a017" stop-opacity=".1"/><stop offset="1" stop-color="#d4a017" stop-opacity="0"/></radialGradient>
    <radialGradient id="cert-seal" cx=".3" cy=".25" r=".78"><stop stop-color="#fff8e1"/><stop offset=".25" stop-color="#ffd700"/><stop offset=".55" stop-color="#b8860b"/><stop offset=".8" stop-color="#4a3810"/><stop offset="1" stop-color="#0e0e08"/></radialGradient>
    <linearGradient id="cert-arc" x1="580" y1="40" x2="860" y2="170" gradientUnits="userSpaceOnUse"><stop stop-color="#ffd700" stop-opacity=".4"/><stop offset=".5" stop-color="#e8c170" stop-opacity=".5"/><stop offset="1" stop-color="#c4762b" stop-opacity=".2"/></linearGradient>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#e6edf3}.secondary{fill:#aeb8c5}.label{font-family:ui-monospace,Consolas,monospace;letter-spacing:1.6px}.seal{transform-origin:720px 95px;animation:cert-spin 30s linear 200}.orbit{stroke-dasharray:500;stroke-dashoffset:0;animation:cert-trace 8s ease-in-out 200}.neb{transform-origin:710px 95px;animation:cert-drift 18s ease-in-out 200}.twk{transform-origin:505px 62px;animation:cert-twk 3.5s ease-in-out 200}@keyframes cert-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes cert-trace{0%,100%{stroke-dashoffset:0;opacity:.6}50%{stroke-dashoffset:200;opacity:1}}@keyframes cert-drift{0%,100%{transform:rotate(-14deg) translate(0,0)}50%{transform:rotate(-14deg) translate(8px,-6px)}}@keyframes cert-twk{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.25)}}@media(prefers-reduced-motion:reduce){.seal,.orbit,.neb,.twk{animation:none}}@media(forced-colors:active){.decor{display:none}.background{fill:Canvas}.border{stroke:CanvasText}text,.secondary{fill:CanvasText}}
    </style>
  </defs>
  <g clip-path="url(#cert-frame)">
    <rect class="background" width="900" height="200" fill="#070b19"/>
    <g class="decor">
      <ellipse class="neb" cx="710" cy="95" rx="320" ry="175" fill="url(#cert-nebula)" transform="rotate(-14 710 95)"/>
      <ellipse cx="820" cy="160" rx="220" ry="100" fill="url(#cert-fire)" transform="rotate(-25 820 160)"/>
      <ellipse cx="440" cy="-10" rx="200" ry="110" fill="url(#cert-nebula)" opacity=".4"/>
      <g fill="#d4c5a0" opacity=".4">
        <circle cx="20" cy="75" r=".6"/><circle cx="65" cy="18" r=".7"/><circle cx="125" cy="68" r=".5"/><circle cx="168" cy="22" r=".6"/><circle cx="220" cy="55" r=".55"/><circle cx="268" cy="17" r=".75"/><circle cx="325" cy="62" r=".6"/><circle cx="378" cy="24" r=".5"/><circle cx="430" cy="68" r=".55"/><circle cx="478" cy="16" r=".6"/>
        <circle cx="24" cy="158" r=".65"/><circle cx="92" cy="176" r=".5"/><circle cx="160" cy="152" r=".55"/><circle cx="235" cy="178" r=".7"/><circle cx="310" cy="160" r=".55"/><circle cx="390" cy="174" r=".6"/><circle cx="460" cy="146" r=".65"/><circle cx="495" cy="98" r=".5"/>
        <circle cx="518" cy="28" r=".7"/><circle cx="555" cy="78" r=".55"/><circle cx="588" cy="14" r=".6"/><circle cx="625" cy="72" r=".5"/><circle cx="658" cy="18" r=".55"/><circle cx="705" cy="36" r=".65"/><circle cx="752" cy="18" r=".7"/><circle cx="798" cy="30" r=".55"/><circle cx="845" cy="58" r=".6"/><circle cx="875" cy="22" r=".55"/>
        <circle cx="525" cy="160" r=".55"/><circle cx="570" cy="182" r=".65"/><circle cx="642" cy="166" r=".5"/><circle cx="678" cy="184" r=".6"/><circle cx="725" cy="168" r=".5"/><circle cx="792" cy="186" r=".7"/><circle cx="840" cy="170" r=".55"/><circle cx="876" cy="135" r=".6"/>
      </g>
      <g class="twk" fill="#ffe8b0"><circle cx="505" cy="62" r="1.1" opacity=".7"/><circle cx="855" cy="42" r="1.15" opacity=".8"/><circle cx="695" cy="16" r="1" opacity=".65"/><circle cx="550" cy="128" r=".9" opacity=".6"/><circle cx="825" cy="150" r="1" opacity=".7"/></g>
      <path d="M865 172v6m-3-3h6M568 38v5m-2.5-2.5h5" fill="none" stroke="#ffe8b0" stroke-opacity=".55" stroke-linecap="round"/>
      <!-- Learning orbit arcs -->
      <ellipse class="orbit" cx="720" cy="95" rx="170" ry="55" transform="rotate(-15 720 95)" fill="none" stroke="url(#cert-arc)" stroke-width=".9"/>
      <ellipse class="orbit" cx="720" cy="95" rx="120" ry="78" transform="rotate(20 720 95)" fill="none" stroke="url(#cert-arc)" stroke-width=".8" opacity=".6"/>
      <!-- Leo zodiac seal -->
      <g class="seal">
        <circle cx="720" cy="95" r="55" fill="url(#cert-glow)"/>
        <circle cx="720" cy="95" r="35" fill="url(#cert-seal)"/>
        <circle cx="720" cy="95" r="34.5" fill="none" stroke="#ffd700" stroke-opacity=".3" stroke-width="1"/>
        <circle cx="720" cy="95" r="28" fill="none" stroke="#d4a017" stroke-opacity=".25" stroke-width=".6"/>
        <!-- Leo symbol (simplified zodiac glyph) -->
        <path d="M708 90C708 84 714 80 720 80S732 84 732 90C732 96 726 100 720 100S708 96 708 90M732 90C738 90 742 94 742 100" fill="none" stroke="#fff8e1" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".8"/>
        <path d="M700 88A20 20 0 0 1 726 76" fill="none" stroke="#fff4d4" stroke-opacity=".5" stroke-width=".8"/>
        <!-- Certificate star clusters -->
        <circle cx="645" cy="58" r="3" fill="#e8c170"/><circle cx="645" cy="58" r="7" fill="#ffd700" opacity=".08"/>
        <circle cx="795" cy="58" r="2.5" fill="#d4b87a"/><circle cx="795" cy="58" r="6" fill="#ffd700" opacity=".06"/>
        <circle cx="650" cy="142" r="2.8" fill="#e8c170"/><circle cx="650" cy="142" r="6.5" fill="#ffd700" opacity=".07"/>
        <circle cx="790" cy="138" r="2.2" fill="#d4b87a"/>
        <circle cx="680" cy="40" r="1.5" fill="#ffd89c" opacity=".6"/>
        <circle cx="760" cy="40" r="1.3" fill="#d4a862" opacity=".5"/>
        <circle cx="670" cy="150" r="1.2" fill="#c9a455" opacity=".5"/>
        <circle cx="770" cy="150" r="1.4" fill="#d4a862" opacity=".5"/>
      </g>
      <!-- Scroll silhouette hint -->
      <path d="M855 220A100 100 0 0 1 940 135" fill="none" stroke="#8b7020" stroke-opacity=".08" stroke-width="10"/>
      <path d="M855 220A100 100 0 0 1 940 135L955 230Z" fill="#100e08" stroke="#a88a30" stroke-opacity=".25"/>
    </g>
    <text x="40" y="39" class="label secondary" font-size="10">SECTOR 05 / SEKHMET PAPYRUS SCROLLS 𓋹</text>
    <text x="38" y="104" font-size="39" font-weight="650" letter-spacing="-1">Scrolls of Ra</text>
    <text x="40" y="137" class="secondary" font-size="15">Sacred Knowledge &amp; Continuous Growth.</text>
    <path class="decor" d="M40 164H70" stroke="#d4a017" stroke-width="1.5"/>
  </g>
  <rect class="border" x=".5" y=".5" width="899" height="199" rx="15.5" fill="none" stroke="#8b7d3e" stroke-opacity=".23"/>
</svg>
