<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="cert-title cert-desc">
  <title id="cert-title">Application panel — Certificates</title>
  <desc id="cert-desc">A DevTools Application panel showing stored professional certificates in a tree view with checkmarks indicating verified credentials.</desc>
  <defs>
    <clipPath id="cert-frame"><rect width="900" height="200" rx="8"/></clipPath>
    <style>
      text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px;fill:#d4d4d4}
      .tab{font-size:11px;fill:#8b949e}.tab-on{font-size:11px;fill:#e6edf3}
      .tree{fill:#8b949e}.ok{fill:#3fb950}.lbl{fill:#e6edf3}
      .dim{fill:#6e7681;font-size:11px}
      @media(forced-colors:active){.bg{fill:Canvas}.bdr{stroke:CanvasText}text,.tab,.tab-on,.tree,.ok,.lbl,.dim{fill:CanvasText}line{stroke:CanvasText}}
    </style>
  </defs>
  <g clip-path="url(#cert-frame)">
    <rect class="bg" width="900" height="200" fill="#0d1117"/>
    <rect width="900" height="28" fill="#161b22"/>
    <rect x="350" y="0" width="86" height="28" fill="#0d1117"/>
    <text x="12" y="18" class="tab">Elements</text>
    <text x="88" y="18" class="tab">Console</text>
    <text x="148" y="18" class="tab">Sources</text>
    <text x="210" y="18" class="tab">Network</text>
    <text x="272" y="18" class="tab">Performance</text>
    <text x="362" y="18" class="tab-on">Application</text>
    <line x1="0" y1="28" x2="900" y2="28" stroke="#30363d"/>
    <rect x="350" y="27" width="86" height="2" fill="#0078d4"/>
    <!-- Sidebar tree -->
    <rect x="0" y="28" width="160" height="172" fill="#161b22"/>
    <line x1="160" y1="28" x2="160" y2="200" stroke="#30363d"/>
    <text x="12" y="52" class="tree">▾ Storage</text>
    <text x="24" y="72" class="tree">▾ Certificates</text>
    <text x="36" y="92" class="lbl" font-size="11">Professional</text>
    <!-- Certificate list -->
    <text x="180" y="56"><tspan class="ok">✓ </tspan><tspan class="lbl">Meta Front-End Developer Professional</tspan></text>
    <text x="180" y="78"><tspan class="ok">✓ </tspan><tspan class="lbl">Google Cloud Digital Leader</tspan></text>
    <text x="180" y="100"><tspan class="ok">✓ </tspan><tspan class="lbl">IBM Full Stack Software Developer</tspan></text>
    <text x="180" y="122"><tspan class="ok">✓ </tspan><tspan class="lbl">AWS Cloud Solutions Architect</tspan></text>
    <text x="180" y="144"><tspan class="ok">✓ </tspan><tspan class="lbl">Deep Learning Specialization</tspan></text>
    <line x1="172" y1="158" x2="700" y2="158" stroke="#21262d" stroke-width="0.5"/>
    <text x="180" y="176" class="dim">5 certificates verified · All credentials active</text>
  </g>
  <rect class="bdr" x=".5" y=".5" width="899" height="199" rx="7.5" fill="none" stroke="#30363d"/>
</svg>
