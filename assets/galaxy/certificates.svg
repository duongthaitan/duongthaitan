        </g>
      </g>
      <circle cx="589" cy="54" r="12" fill="url(#cert-moon)"/>
      <path d="M578 51A12 12 0 0 1 592 42" fill="none" stroke="#f9e9e3" stroke-opacity=".7" stroke-width=".8"/>
