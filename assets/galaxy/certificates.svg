<text x="871" y="34" font-size="13" textLength="31.2" class="mu" text-anchor="end" style="animation:in 6500ms linear(0, 0 34.3%, 0.32 34.8%, 0.66 35.4%, 0.91 36.4%, 1 39.9%, 1 100%) 0ms infinite alternate both">done</text>
