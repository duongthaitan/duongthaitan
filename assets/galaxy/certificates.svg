    <radialGradient id="cert-rose"><stop stop-color="#b3619b" stop-opacity=".24"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="cert-aura"><stop stop-color="#bfb0f2" stop-opacity=".16"/><stop offset=".55" stop-color="#9a86d6" stop-opacity=".07"/><stop offset="1" stop-color="#9a86d6" stop-opacity="0"/></radialGradient>
    <linearGradient id="cert-edge" x1="640" y1="64" x2="775" y2="148" gradientUnits="userSpaceOnUse"><stop stop-color="#bbb7ce"/><stop offset=".24" stop-color="#696582"/><stop offset=".6" stop-color="#22263f"/><stop offset=".86" stop-color="#55536e"/><stop offset="1" stop-color="#9490ac"/></linearGradient>
    <radialGradient id="cert-metal" cx=".29" cy=".14" r=".92"><stop stop-color="#e9e1ec"/><stop offset=".22" stop-color="#c2b9d4"/><stop offset=".48" stop-color="#8c84a6"/><stop offset=".7" stop-color="#48465f"/><stop offset="1" stop-color="#222941"/></radialGradient>
    <radialGradient id="cert-face" cx=".32" cy=".24" r=".9"><stop stop-color="#465074"/><stop offset=".42" stop-color="#252e4e"/><stop offset="1" stop-color="#0e182e"/></radialGradient>
    <linearGradient id="cert-rim" x1="657" y1="54" x2="754" y2="152" gradientUnits="userSpaceOnUse"><stop stop-color="#f2eaf6"/><stop offset=".45" stop-color="#c6bcdc"/><stop offset=".72" stop-color="#626180"/><stop offset="1" stop-color="#a7a1c6"/></linearGradient>
    <radialGradient id="cert-moon" cx=".24" cy=".2" r=".83"><stop stop-color="#f8e6dd"/><stop offset=".29" stop-color="#c7b4c9"/><stop offset=".61" stop-color="#786980"/><stop offset="1" stop-color="#15192c"/></radialGradient>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#e6edf3}.secondary{fill:#aeb8c5}.label{font-family:ui-monospace,Consolas,monospace;letter-spacing:1.6px}.medallion{transform-origin:707px 102px;animation:cert-settle 3.8s ease-out 1}@keyframes cert-settle{from{transform:translate(0,3px) rotate(-2deg)}to{transform:translate(0,0) rotate(0)}}@media(prefers-reduced-motion:reduce){.medallion{animation:none}}@media(forced-colors:active){.decor{display:none}.background{fill:Canvas}.border{stroke:CanvasText}text,.secondary{fill:CanvasText}}
    </style>
  </defs>
