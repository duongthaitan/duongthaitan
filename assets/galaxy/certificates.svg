<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="cert-title cert-desc">
  <title id="cert-title">Learning coordinates — Certificates</title>
  <desc id="cert-desc">A tilted silver-violet star-atlas medallion has a raised, faceted compass star and engraved constellations. Two small shaded moons and delicate orbital arcs frame the instrument against a deep nebula sky.</desc>
  <defs>
    <clipPath id="cert-frame"><rect width="900" height="200" rx="16"/></clipPath>
