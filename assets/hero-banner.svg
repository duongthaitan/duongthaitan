<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Duong Thai Tan — Frontend Developer and UI/UX Designer</title>
  <desc id="desc">A neon terminal and orbital wireframe. Based in Vietnam. Building interfaces with code, care, and a creative eye.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset=".52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#8b5cf6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#aeb8c5" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="898" height="358" rx="18"/></clipPath>
    <style>
      .ink{fill:#e6edf3}.muted{fill:#aeb8c5}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
      .orbit{transform-origin:708px 184px;animation:orbit 4s ease-in-out 1}
      .cursor{animation:blink 1s step-end 4}
      .trace{stroke-dasharray:1100;stroke-dashoffset:0;animation:trace 3s ease-out 1}
      @keyframes orbit{0%{transform:rotate(-12deg);opacity:.3}100%{transform:rotate(0);opacity:1}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes trace{from{stroke-dashoffset:1100}to{stroke-dashoffset:0}}
      @media(prefers-reduced-motion:reduce){.orbit,.cursor,.trace{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="900" height="360" fill="#0d1117"/>
    <rect width="900" height="360" fill="url(#grid)"/>
    <circle cx="710" cy="180" r="230" fill="url(#halo)"/>
    <path d="M0 49H900M0 302H900" stroke="#283140"/>
    <g fill="#6e7681">
      <circle cx="28" cy="25" r="4"/><circle cx="44" cy="25" r="4"/><circle cx="60" cy="25" r="4"/>
    </g>
    <text x="86" y="30" class="mono muted" font-size="13">duongthaitan / creative workspace</text>
    <text x="869" y="30" text-anchor="end" class="mono muted" font-size="12">PROFILE / 01</text>
    <rect x="44" y="83" width="28" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="84" y="89" class="mono muted" font-size="14" letter-spacing="2">CODE MEETS CRAFT</text>
    <g class="sans ink" font-size="67" font-weight="750" letter-spacing="-2">
      <text x="41" y="166">DUONG</text>
      <text x="41" y="239">THAI TAN<tspan fill="#a78bfa">.</tspan></text>
    </g>
    <text x="44" y="277" class="sans muted" font-size="18">Frontend developer. UI/UX mindset. Vietnam.</text>
    <g class="orbit" fill="none" stroke="url(#accent)" stroke-width="1.3">
      <ellipse cx="708" cy="184" rx="144" ry="54" transform="rotate(-30 708 184)" opacity=".7"/>
      <ellipse cx="708" cy="184" rx="144" ry="54" transform="rotate(30 708 184)" opacity=".45"/>
      <ellipse cx="708" cy="184" rx="144" ry="54" transform="rotate(90 708 184)" opacity=".55"/>
      <path class="trace" d="M708 97 786 143 786 229 708 273 630 229 630 143ZM708 97V184L786 229M630 229 708 184 786 143M630 143 708 184V273"/>
      <circle cx="708" cy="184" r="8" stroke-opacity=".4"/>
    </g>
    <g fill="#c4b5fd">
      <circle cx="583" cy="256" r="3"/>
      <circle cx="831" cy="111" r="3"/>
      <circle cx="708" cy="41" r="2"/>
    </g>
    <path d="M554 82h14m-7-7v14M849 278h14m-7-7v14" stroke="#aeb8c5" stroke-opacity=".5"/>
    <text x="28" y="336" class="mono" font-size="14"><tspan fill="#c4b5fd">~/studio $ </tspan><tspan class="ink">build something worth feeling</tspan></text>
    <rect x="372" y="323" width="8" height="16" rx="1" fill="#38bdf8" class="cursor"/>
    <text x="872" y="336" text-anchor="end" class="mono muted" font-size="12">DESIGN / DEVELOP / REFINE</text>
    <path d="M18 359H882" stroke="url(#accent)" stroke-width="2"/>
  </g>
  <rect x=".5" y=".5" width="899" height="359" rx="18" fill="none" stroke="#303a49"/>
</svg>
