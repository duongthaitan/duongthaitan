<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Duong Thai Tan — Code burns bright. Leo developer and UI/UX enthusiast from Vietnam, beneath the Leo constellation.</title>
  <desc id="hero-desc">The nine stars of Leo trace a golden sickle and triangle across deep space. Regulus, the heart star, radiates a warm corona while amber and gold nebulae glow behind the constellation. A curved warm horizon anchors the lower edge.</desc>
  <defs>
    <clipPath id="hero-frame"><rect width="900" height="360" rx="20"/></clipPath>
    <radialGradient id="hero-gold"><stop stop-color="#d4a017" stop-opacity=".4"/><stop offset=".48" stop-color="#8b6914" stop-opacity=".18"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero-amber"><stop stop-color="#c4762b" stop-opacity=".26"/><stop offset=".5" stop-color="#7a4a1e" stop-opacity=".12"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero-fire"><stop stop-color="#e05a30" stop-opacity=".16"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero-corona"><stop stop-color="#ffd700" stop-opacity=".28"/><stop offset=".28" stop-color="#d4a017" stop-opacity=".14"/><stop offset=".58" stop-color="#8b6914" stop-opacity=".05"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero-regulus" cx=".3" cy=".24" r=".76"><stop stop-color="#fff8e1"/><stop offset=".28" stop-color="#ffd700"/><stop offset=".58" stop-color="#d4a017"/><stop offset="1" stop-color="#6b4f10"/></radialGradient>
    <radialGradient id="hero-denebola" cx=".28" cy=".22" r=".8"><stop stop-color="#fff0d4"/><stop offset=".32" stop-color="#e8c170"/><stop offset=".68" stop-color="#8b6c3a"/><stop offset="1" stop-color="#1a1428"/></radialGradient>
    <radialGradient id="hero-horizon" cx=".53" cy="0" r=".7"><stop stop-color="#4a3a28"/><stop offset=".18" stop-color="#261c14"/><stop offset=".5" stop-color="#120d0a"/><stop offset="1" stop-color="#060a16"/></radialGradient>
    <linearGradient id="hero-rim"><stop stop-color="#d4a017" stop-opacity="0"/><stop offset=".35" stop-color="#e8c170" stop-opacity=".5"/><stop offset=".65" stop-color="#ffd700" stop-opacity=".8"/><stop offset="1" stop-color="#d4a017" stop-opacity=".15"/></linearGradient>
    <linearGradient id="hero-trace" x1="588" y1="60" x2="848" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#ffd700" stop-opacity=".8"/><stop offset=".5" stop-color="#e8c170" stop-opacity=".9"/><stop offset="1" stop-color="#d4a017" stop-opacity=".6"/></linearGradient>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#e6edf3}.secondary{fill:#aeb8c5}.label{font-family:ui-monospace,Consolas,monospace;letter-spacing:1.7px}.leo-trace{stroke-dasharray:600;stroke-dashoffset:0;animation:hero-trace 3.5s ease-out 1}.corona-settle{transform-origin:655px 158px;animation:hero-corona 3.8s ease-out 1}.nebula-settle{animation:hero-nebula 4s ease-out 1}.spark{animation:hero-spark 4.2s ease-out 1}@keyframes hero-trace{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}@keyframes hero-corona{from{transform:scale(.82);opacity:.4}to{transform:scale(1);opacity:1}}@keyframes hero-nebula{from{transform:translate(8px,0)}to{transform:translate(0,0)}}@keyframes hero-spark{from{transform:translateY(6px);opacity:0}55%{opacity:1}to{transform:translateY(0);opacity:.7}}@media(prefers-reduced-motion:reduce){.leo-trace,.corona-settle,.nebula-settle,.spark{animation:none}}@media(forced-colors:active){.decor{display:none}.background{fill:Canvas}.border{stroke:CanvasText}text,.secondary{fill:CanvasText}}
    </style>
  </defs>
  <g clip-path="url(#hero-frame)">
    <rect class="background" width="900" height="360" fill="#070b19"/>
    <g class="decor">
      <!-- Nebulae — golden atmosphere -->
      <g class="nebula-settle">
        <ellipse cx="680" cy="140" rx="380" ry="235" fill="url(#hero-gold)" transform="rotate(-16 680 140)"/>
        <ellipse cx="810" cy="185" rx="265" ry="118" fill="url(#hero-amber)" transform="rotate(-30 810 185)"/>
        <ellipse cx="490" cy="48" rx="225" ry="105" fill="url(#hero-amber)" transform="rotate(-22 490 48)"/>
        <ellipse cx="545" cy="295" rx="400" ry="90" fill="url(#hero-fire)"/>
      </g>
      <!-- Star field — warm tints -->
      <g fill="#d4c5a0" opacity=".38">
        <circle cx="28" cy="91" r=".7"/><circle cx="61" cy="21" r=".8"/><circle cx="114" cy="72" r=".55"/><circle cx="151" cy="28" r=".7"/><circle cx="191" cy="83" r=".6"/><circle cx="232" cy="19" r="1"/><circle cx="278" cy="69" r=".65"/><circle cx="321" cy="28" r=".55"/><circle cx="357" cy="93" r=".8"/><circle cx="399" cy="17" r=".65"/><circle cx="447" cy="61" r=".85"/><circle cx="475" cy="119" r=".6"/>
        <circle cx="21" cy="187" r=".6"/><circle cx="80" cy="165" r=".6"/><circle cx="157" cy="239" r=".55"/><circle cx="296" cy="234" r=".7"/><circle cx="343" cy="169" r=".55"/><circle cx="386" cy="244" r=".65"/><circle cx="423" cy="193" r=".9"/><circle cx="458" cy="270" r=".8"/><circle cx="483" cy="211" r=".55"/><circle cx="35" cy="277" r=".65"/><circle cx="102" cy="298" r=".75"/><circle cx="214" cy="284" r=".55"/><circle cx="328" cy="298" r=".65"/>
        <circle cx="514" cy="28" r=".7"/><circle cx="540" cy="81" r=".65"/><circle cx="578" cy="14" r=".6"/><circle cx="614" cy="36" r=".95"/><circle cx="652" cy="20" r=".55"/><circle cx="730" cy="29" r=".8"/><circle cx="779" cy="18" r=".6"/><circle cx="851" cy="29" r=".85"/><circle cx="882" cy="67" r=".65"/><circle cx="856" cy="119" r=".7"/><circle cx="889" cy="174" r=".6"/>
        <circle cx="526" cy="177" r=".75"/><circle cx="557" cy="123" r=".5"/><circle cx="594" cy="207" r=".7"/><circle cx="517" cy="258" r=".6"/><circle cx="556" cy="300" r=".65"/><circle cx="618" cy="277" r=".85"/><circle cx="706" cy="274" r=".6"/><circle cx="763" cy="244" r=".8"/><circle cx="810" cy="272" r=".65"/><circle cx="866" cy="238" r=".8"/><circle cx="892" cy="295" r=".55"/>
        <circle cx="495" cy="65" r=".5"/><circle cx="567" cy="57" r=".55"/><circle cx="789" cy="98" r=".55"/><circle cx="836" cy="194" r=".6"/><circle cx="448" cy="150" r=".5"/><circle cx="379" cy="282" r=".5"/><circle cx="57" cy="242" r=".5"/><circle cx="250" cy="262" r=".5"/><circle cx="754" cy="315" r=".7"/>
      </g>
      <!-- Bright stars — golden -->
      <g fill="#ffe8b0">
        <circle cx="408" cy="89" r="1.25" opacity=".8"/><circle cx="348" cy="55" r="1" opacity=".7"/><circle cx="24" cy="145" r="1" opacity=".6"/><circle cx="484" cy="304" r="1.2" opacity=".7"/><circle cx="874" cy="208" r="1.1" opacity=".7"/><circle cx="838" cy="42" r=".95" opacity=".7"/><circle cx="670" cy="288" r="1.3"/>
      </g>
      <!-- Cross sparkles -->
      <g fill="none" stroke="#ffe8b0" stroke-linecap="round">
        <path d="M545 37v8m-4-4h8" opacity=".6"/><path d="M861 153v6m-3-3h6" opacity=".5"/><path d="M409 275v6m-3-3h6" opacity=".45"/>
      </g>
      <!-- Faint orbit arcs -->
      <ellipse cx="700" cy="148" rx="238" ry="104" transform="rotate(-20 700 148)" fill="none" stroke="#c9a455" stroke-opacity=".12" stroke-width=".8"/>
      <path d="M442 241C532 138 729 59 890 68" fill="none" stroke="#c9a455" stroke-opacity=".09"/>
      <!-- LEO CONSTELLATION -->
      <g class="corona-settle">
        <!-- Regulus corona — golden mane glow -->
        <circle cx="655" cy="158" r="120" fill="url(#hero-corona)" opacity=".35"/>
        <circle cx="655" cy="158" r="72" fill="url(#hero-corona)"/>
        <!-- Sickle (head of Leo) — the iconic backwards question mark -->
        <path class="leo-trace" d="M588 62L618 44L658 57L692 88L680 120L655 158" fill="none" stroke="url(#hero-trace)" stroke-width="1.4" opacity=".85"/>
        <!-- Body triangle + connection to head -->
        <path class="leo-trace" d="M692 88L764 98L850 132" fill="none" stroke="url(#hero-trace)" stroke-width="1.3" opacity=".8"/>
        <path class="leo-trace" d="M764 98L780 162L850 132" fill="none" stroke="url(#hero-trace)" stroke-width="1.1" opacity=".65"/>
        <!-- Faint structural lines -->
        <path d="M655 158L764 98M618 44L692 88" fill="none" stroke="#c9a455" stroke-opacity=".2" stroke-width=".7"/>
        <!-- Constellation stars -->
        <!-- epsilon — Ras Elased Australis (top of head) -->
        <circle cx="588" cy="62" r="2.8" fill="#ffe8b0"/><circle cx="588" cy="62" r="6" fill="#ffd700" opacity=".08"/>
        <!-- mu — Rasalas -->
        <circle cx="618" cy="44" r="2.2" fill="#ffd89c"/><circle cx="618" cy="44" r="5" fill="#ffd700" opacity=".06"/>
        <!-- zeta — Adhafera -->
        <circle cx="658" cy="57" r="2.6" fill="#ffe8b0"/>
        <!-- gamma — Algieba (mane junction) -->
        <circle cx="692" cy="88" r="3.8" fill="#ffd700"/><circle cx="692" cy="88" r="10" fill="#ffd700" opacity=".12"/>
        <!-- eta — Al Jabhah -->
        <circle cx="680" cy="120" r="2.6" fill="#ffe8b0"/>
        <!-- ALPHA — REGULUS — King Star of Leo -->
        <circle cx="655" cy="158" r="9" fill="url(#hero-regulus)"/>
        <circle cx="655" cy="158" r="15" fill="#ffd700" opacity=".1"/>
        <path d="M647 155A9 9 0 0 1 661 149" fill="none" stroke="#fff8e1" stroke-opacity=".65" stroke-width=".9"/>
        <!-- delta — Zosma (hip) -->
        <circle cx="764" cy="98" r="3.2" fill="#e8c170"/><circle cx="764" cy="98" r="8" fill="#e8c170" opacity=".08"/>
        <!-- theta — Chertan (hind leg) -->
        <circle cx="780" cy="162" r="2.6" fill="#d4b87a"/>
        <!-- beta — Denebola (tail tip) -->
        <circle cx="850" cy="132" r="4.2" fill="url(#hero-denebola)"/><circle cx="850" cy="132" r="10" fill="#e8c170" opacity=".1"/>
        <path d="M842 129A4.2 4.2 0 0 1 853 125" fill="none" stroke="#fff0d4" stroke-opacity=".5" stroke-width=".7"/>
        <!-- Companion dots near constellation -->
        <circle cx="728" cy="90" r="1.2" fill="#d4a862" opacity=".55"/>
        <circle cx="812" cy="150" r="1" fill="#c9a455" opacity=".45"/>
        <circle cx="635" cy="102" r=".9" fill="#d4b87a" opacity=".5"/>
      </g>
      <!-- Flame sparks — small golden particles -->
      <g class="spark" fill="#ffd700">
        <circle cx="640" cy="140" r="1.1" opacity=".5"/><circle cx="672" cy="135" r=".8" opacity=".4"/><circle cx="625" cy="170" r=".9" opacity=".45"/><circle cx="688" cy="165" r=".7" opacity=".35"/><circle cx="650" cy="185" r="1" opacity=".3"/>
      </g>
      <!-- Horizon -->
      <path d="M-100 400C164 267 510 246 1010 337" fill="none" stroke="#c9a455" stroke-opacity=".06" stroke-width="20"/>
      <path d="M-100 400C164 267 510 246 1010 337" fill="none" stroke="#d4a017" stroke-opacity=".1" stroke-width="7"/>
      <path d="M-100 400C164 267 510 246 1010 337L1010 520H-100Z" fill="url(#hero-horizon)"/>
      <path d="M-100 400C164 267 510 246 1010 337" fill="none" stroke="url(#hero-rim)" stroke-width="1.5"/>
      <path d="M302 325C477 304 688 311 805 331" fill="none" stroke="#c9a455" stroke-opacity=".09"/>
    </g>
    <!-- Text — left side -->
    <text x="44" y="48" class="label secondary" font-size="11">LEO DEVELOPER / FRONTEND / VIETNAM</text>
    <g font-size="74" font-weight="750" letter-spacing="-2.8">
      <text x="39" y="132">Duong</text>
      <text x="39" y="209">Thai Tan<tspan fill="#ffd700">.</tspan></text>
    </g>
    <text x="44" y="253" font-size="23" font-weight="400">Code burns bright</text>
    <path class="decor" d="M44 285H86" stroke="#d4a017" stroke-width="2"/>
    <text x="44" y="330" class="label secondary" font-size="10">DESIGN / DEVELOP / EXPLORE</text>
  </g>
  <rect class="border" x=".5" y=".5" width="899" height="359" rx="19.5" fill="none" stroke="#8b7d3e" stroke-opacity=".25"/>
</svg>
