    <text x="44" y="48" class="label secondary" font-size="11">FRONTEND / UI-UX / VIETNAM</text>
    <g font-size="74" font-weight="750" letter-spacing="-2.8">
      <text x="39" y="132">Duong</text>
      <text x="39" y="209">Thai Tan<tspan fill="#c1b1f1">.</tspan></text>
    </g>
    <text x="44" y="253" font-size="23" font-weight="400">Code meets cosmos</text>
    <path class="decor" d="M44 285H86" stroke="#b9a3ed" stroke-width="2"/>
    <text x="44" y="330" class="label secondary" font-size="10">DESIGN / DEVELOP / EXPLORE</text>
  </g>
  <rect class="border" x=".5" y=".5" width="899" height="359" rx="19.5" fill="none" stroke="#8390b7" stroke-opacity=".25"/>
</svg>
