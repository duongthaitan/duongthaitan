<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img">
  <title id="hero-title">V3 God-Tier Sekhmet Solar Parallax Engine</title>
  <defs>
    <clipPath id="hero-frame"><rect width="900" height="400" rx="30"/></clipPath>

    <!-- Extreme Glow Filters -->
    <filter id="god-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feGaussianBlur stdDeviation="30" result="blur3" />
      <feGaussianBlur stdDeviation="60" result="blur4" />
      <feMerge>
        <feMergeNode in="blur4" />
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="sun-core" cx=".5" cy=".5" r=".5">
      <stop stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".1" stop-color="#fff8e1" stop-opacity="1"/>
      <stop offset=".4" stop-color="#ff7700" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b82800" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Path for AnimateMotion -->
    <path id="comet-path" d="M -100 0 Q 450 -100 1000 400" fill="none"/>
    <path id="comet-path-2" d="M 1000 0 Q 450 500 -100 300" fill="none"/>
  </defs>

  <g clip-path="url(#hero-frame)">
    <!-- Absolute Dark Background -->
    <rect width="900" height="400" fill="#010205"/>

    <!-- Dynamic Pulsing Background Core -->
    <circle cx="700" cy="200" r="450" fill="url(#sun-core)" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="scale" values="0.95;1.05;0.95" dur="12s" repeatCount="indefinite" transform-origin="700 200" />
    </circle>

    <!-- Parallax Background Stars (Slow) -->
    <g fill="#ffffff" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="-15,0; 15,0; -15,0" dur="20s" repeatCount="indefinite" />
      <circle cx="100" cy="50" r="1.5"/><circle cx="200" cy="150" r="1"/><circle cx="300" cy="80" r="2"/>
      <circle cx="450" cy="300" r="1.5"/><circle cx="150" cy="350" r="2"/><circle cx="800" cy="80" r="1.5"/>
    </g>

    <!-- Middleground Constellations -->
    <g stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.3">
       <animateTransform attributeName="transform" type="rotate" values="0 700 200; 360 700 200" dur="120s" repeatCount="indefinite" />
       <path d="M 500 100 L 550 50 L 600 80 L 650 30"/>
       <circle cx="500" cy="100" r="2" fill="#fff" stroke="none"/><circle cx="550" cy="50" r="2" fill="#fff" stroke="none"/>
       <circle cx="600" cy="80" r="2" fill="#fff" stroke="none"/><circle cx="650" cy="30" r="2" fill="#fff" stroke="none"/>
    </g>

    <!-- Sun Core - The Heart of Leo -->
    <g filter="url(#god-glow)">
      <!-- V3 Solar Flares (Spiky shapes rotating) -->
      <path d="M 700 0 L 710 170 L 850 100 L 720 190 L 900 200 L 720 210 L 850 300 L 710 230 L 700 400 L 690 230 L 550 300 L 680 210 L 500 200 L 680 190 L 550 100 L 690 170 Z" fill="#ff7700" opacity="0.15">
        <animateTransform attributeName="transform" type="rotate" values="0 700 200; 360 700 200" dur="40s" repeatCount="indefinite" />
      </path>
      
      <circle cx="700" cy="200" r="120" fill="url(#sun-core)">
        <animateTransform attributeName="transform" type="scale" values="0.98;1.02;0.98" dur="2s" repeatCount="indefinite" transform-origin="700 200" />
      </circle>

      <!-- The Divine Eye of Ra (Cyberpunk Edition) -->
      <g filter="url(#neon)">
         <path d="M 640 180 Q 700 130 760 180" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
         <path d="M 630 205 Q 700 150 770 205 Q 700 260 630 205" fill="none" stroke="#ffd700" stroke-width="8" stroke-linecap="round"/>
         <circle cx="700" cy="200" r="22" fill="#ffffff"/>
         <circle cx="700" cy="200" r="12" fill="#ff7700"/>
         <circle cx="700" cy="200" r="5" fill="#000000"/>
         <!-- Tech Tears -->
         <path d="M 740 215 Q 755 250 740 280" fill="none" stroke="#ffd700" stroke-width="5" stroke-linecap="round"/>
         <path d="M 660 215 L 670 240 L 650 260" fill="none" stroke="#ffd700" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Kinetic Rings (Astrolabe / Gyroscope) -->
    <g filter="url(#neon)">
      <!-- Ring X -->
      <ellipse cx="700" cy="200" rx="260" ry="80" fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="10 30" transform="rotate(-20 700 200)">
        <animateTransform attributeName="transform" type="rotate" values="-20 700 200; 340 700 200" dur="20s" repeatCount="indefinite" />
      </ellipse>
      <!-- Ring Y -->
      <ellipse cx="700" cy="200" rx="160" ry="320" fill="none" stroke="#ff7700" stroke-width="1.5" stroke-dasharray="50 50" transform="rotate(50 700 200)">
        <animateTransform attributeName="transform" type="rotate" values="50 700 200; -310 700 200" dur="30s" repeatCount="indefinite" />
      </ellipse>
      <!-- Ring Z -->
      <circle cx="700" cy="200" r="220" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8" opacity="0.5">
         <animateTransform attributeName="transform" type="scale" values="1; 1.05; 1" dur="1s" repeatCount="indefinite" transform-origin="700 200"/>
      </circle>
    </g>

    <!-- Shooting Comets using AnimateMotion -->
    <g>
      <circle r="3" fill="#ffffff" filter="url(#neon)">
        <animateMotion dur="5s" repeatCount="indefinite">
           <mpath href="#comet-path"/>
        </animateMotion>
      </circle>
      <path d="M 0 0 L -40 -10 L -40 10 Z" fill="#ffd700" opacity="0.5">
        <animateMotion dur="5s" repeatCount="indefinite" rotate="auto">
           <mpath href="#comet-path"/>
        </animateMotion>
      </path>
    </g>
    <g>
      <circle r="4" fill="#ff7700" filter="url(#neon)">
        <animateMotion dur="8s" repeatCount="indefinite" begin="2s">
           <mpath href="#comet-path-2"/>
        </animateMotion>
      </circle>
    </g>

    <!-- Kinetic Typography -->
    <g transform="translate(50, 0)">
      <g filter="url(#neon)">
        <!-- Animated Badge -->
        <rect x="0" y="60" width="280" height="28" rx="8" fill="#1e180a" stroke="#ffd700" stroke-width="1.5"/>
        <circle cx="15" cy="74" r="5" fill="#ff0000">
           <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
        </circle>
        <text x="30" y="79" font-family="monospace" font-size="12" font-weight="700" fill="#ffd700" letter-spacing="1">
          SYS.BOOT(SEKHMET_V3_GOD_TIER)
        </text>
      </g>

      <text x="0" y="170" font-family="system-ui" font-size="60" font-weight="900" letter-spacing="-2" fill="#ffffff" filter="url(#neon)">
        DUONG THAI TAN
      </text>

      <text x="0" y="215" font-family="system-ui" font-size="28" font-weight="800" fill="#ff7700" letter-spacing="2">
        <animate attributeName="opacity" values="0.8; 1; 0.8" dur="2s" repeatCount="indefinite" />
        KINETIC 3D ARCHITECT
      </text>

      <text x="0" y="250" font-family="system-ui" font-size="16" fill="#c2b280" font-weight="600" letter-spacing="1">
        WEBGL // SHADERS // GSAP // FRONTEND ENGINEERING
      </text>
      
      <!-- Scanline / Typewriter Text -->
      <g filter="url(#neon)">
        <text x="0" y="280" font-family="monospace" font-size="13" fill="#7ee787" font-weight="700">
          [+] INIT SOLAR FLARE OVERDRIVE...
          <animate attributeName="opacity" values="1; 0; 1" dur="0.5s" repeatCount="indefinite" step="end"/>
        </text>
      </g>
    </g>
    
    <!-- Heavy Cyber Border -->
    <rect x="2" y="2" width="896" height="396" rx="28" fill="none" stroke="#ffd700" stroke-width="4" opacity="0.3" filter="url(#neon)"/>
    <path d="M 0 50 L 20 50 L 20 100 L 0 100" fill="none" stroke="#ffd700" stroke-width="5" filter="url(#neon)"/>
  </g>
</svg>
