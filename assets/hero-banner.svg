      <circle cx="817" cy="48" r="2.5" fill="#a68aab" opacity=".3"/>
      <path d="M-100 400C164 267 510 246 1010 337" fill="none" stroke="#7d8dfa" stroke-opacity=".08" stroke-width="23"/>
      <path d="M-100 400C164 267 510 246 1010 337" fill="none" stroke="#a5b8ff" stroke-opacity=".13" stroke-width="8"/>
