<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Duong Thai Tan — Code meets cosmos</title>
  <desc id="hero-desc">Frontend, UI-UX, Vietnam. A luminous violet ringed planet and a small moon float above a curved blue planetary horizon. Layered indigo and rose nebulae deepen a field of distant stars beside the profile name.</desc>
  <defs>
    <clipPath id="hero-frame"><rect width="900" height="360" rx="20"/></clipPath>
    <clipPath id="hero-globe"><circle cx="694" cy="155" r="94"/></clipPath>
    <radialGradient id="hero-indigo"><stop stop-color="#5a48c5" stop-opacity=".48"/><stop offset=".5" stop-color="#392665" stop-opacity=".22"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero-rose"><stop stop-color="#c2539b" stop-opacity=".28"/><stop offset=".48" stop-color="#703d8e" stop-opacity=".13"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero-haze"><stop stop-color="#7894ef" stop-opacity=".2"/><stop offset="1" stop-color="#070b19" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero-atmosphere"><stop offset=".76" stop-color="#a3a4ff" stop-opacity="0"/><stop offset=".83" stop-color="#a3a4ff" stop-opacity=".2"/><stop offset="1" stop-color="#8683ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero-surface" cx=".29" cy=".23" r=".8"><stop stop-color="#f3e3e9"/><stop offset=".24" stop-color="#cbbce8"/><stop offset=".48" stop-color="#8b80bd"/><stop offset=".73" stop-color="#41456f"/><stop offset="1" stop-color="#10162c"/></radialGradient>
    <radialGradient id="hero-night" cx=".19" cy=".18" r=".94"><stop offset=".34" stop-color="#060b1a" stop-opacity="0"/><stop offset=".69" stop-color="#060b1a" stop-opacity=".25"/><stop offset="1" stop-color="#060b1a" stop-opacity=".93"/></radialGradient>
    <linearGradient id="hero-rings" x1="522" y1="112" x2="860" y2="212" gradientUnits="userSpaceOnUse"><stop stop-color="#9e9cdf"/><stop offset=".25" stop-color="#e6dbef"/><stop offset=".49" stop-color="#b49dd6"/><stop offset=".78" stop-color="#7f76b9"/><stop offset="1" stop-color="#d9c7e9"/></linearGradient>
    <linearGradient id="hero-rim" x1="611" y1="86" x2="782" y2="211" gradientUnits="userSpaceOnUse"><stop stop-color="#f4e9fa"/><stop offset=".48" stop-color="#c5b9f7" stop-opacity=".45"/><stop offset="1" stop-color="#7588de" stop-opacity="0"/></linearGradient>
    <radialGradient id="hero-moon" cx=".26" cy=".22" r=".8"><stop stop-color="#fff0de"/><stop offset=".4" stop-color="#c9aac2"/><stop offset=".73" stop-color="#61536f"/><stop offset="1" stop-color="#171b31"/></radialGradient>
    <radialGradient id="hero-horizon" cx=".53" cy="0" r=".7"><stop stop-color="#395486"/><stop offset=".16" stop-color="#17263f"/><stop offset=".48" stop-color="#0a1326"/><stop offset="1" stop-color="#060a16"/></radialGradient>
    <linearGradient id="hero-horizon-rim"><stop stop-color="#8185dd" stop-opacity="0"/><stop offset=".38" stop-color="#929de9" stop-opacity=".6"/><stop offset=".67" stop-color="#d4deff"/><stop offset="1" stop-color="#8f9cf1" stop-opacity=".2"/></linearGradient>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#e6edf3}.secondary{fill:#aeb8c5}.label{font-family:ui-monospace,Consolas,monospace;letter-spacing:1.7px}.planet-settle{transform-origin:694px 155px;animation:hero-settle 3.8s ease-out 1}.nebula-settle{animation:hero-nebula 4s ease-out 1}@keyframes hero-settle{from{transform:translate(5px,3px) rotate(2deg)}to{transform:translate(0,0) rotate(0)}}@keyframes hero-nebula{from{transform:translate(8px,0)}to{transform:translate(0,0)}}@media(prefers-reduced-motion:reduce){.planet-settle,.nebula-settle{animation:none}}@media(forced-colors:active){.decor{display:none}.background{fill:Canvas}.border{stroke:CanvasText}text,.secondary{fill:CanvasText}}
    </style>
  </defs>
