          <path d="M595 151C643 127 682 172 732 155S785 162 801 169" stroke="#554d8a" stroke-width="7" stroke-opacity=".25"/>
          <path d="M592 177C637 151 680 194 734 178S782 185 797 190" stroke="#eac7dd" stroke-width="16" stroke-opacity=".13"/>
          <path d="M610 198C650 180 701 211 751 201S793 209 800 214" stroke="#c3b7db" stroke-width="3" stroke-opacity=".2"/>
          <path d="M602 111C650 88 699 133 760 112" stroke="#fff2ed" stroke-width="2" stroke-opacity=".19"/>
          <path d="M590 180C659 221 733 193 800 133" stroke="#171b32" stroke-width="11" stroke-opacity=".34"/>
