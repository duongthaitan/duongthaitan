<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ht hd"
     style="max-width:100%;height:auto">
  <title id="ht">Duong Thai Tan — Full-Stack Developer and Visual Creator</title>
  <desc id="hd">Dark luxury hero banner with animated light effects showcasing developer profile</desc>

  <defs>
    <linearGradient id="gh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#b8b8bd"/>
    </linearGradient>
    <linearGradient id="ga" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="35%" stop-color="#ff8c32" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffb450" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#ff8c32" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="35%" stop-color="#64a0ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8cc8ff" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#64a0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="25%" stop-color="#ff8c32" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="75%" stop-color="#64a0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="900" height="420" fill="#0a0a0b"/>

  <!-- Ambient glow -->
  <circle cx="180" cy="160" r="120" fill="#ff8c32" opacity="0.02">
    <animate attributeName="opacity" values="0.02;0.05;0.02" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="200" r="140" fill="#64a0ff" opacity="0.015">
    <animate attributeName="opacity" values="0.015;0.04;0.015" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="300" r="100" fill="#ff8c32" opacity="0.01">
    <animate attributeName="opacity" values="0.01;0.035;0.01" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated light streaks — amber (tail lights) -->
  <rect x="100" y="125" width="700" height="1.5" rx="1" fill="url(#ga)" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;28,0;0,0" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="50" y="180" width="800" height="1" rx="0.5" fill="url(#ga)" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.45;0.2" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;18,0;0,0" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="150" y="320" width="600" height="0.8" rx="0.4" fill="url(#ga)" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;24,0;0,0" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated light streaks — blue (headlights) -->
  <rect x="200" y="155" width="500" height="1" rx="0.5" fill="url(#gb)" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-22,0;0,0" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="300" y="195" width="400" height="1" rx="0.5" fill="url(#gb)" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-15,0;0,0" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="250" y="360" width="400" height="0.8" rx="0.4" fill="url(#gb)" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-20,0;0,0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating particles -->
  <circle cx="150" cy="80" r="1.2" fill="#ff8c32" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="95" r="0.8" fill="#64a0ff" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="620" cy="70" r="1" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="4.5s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="780" cy="110" r="0.9" fill="#ff8c32" opacity="0">
    <animate attributeName="opacity" values="0;0.65;0" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="260" cy="340" r="1.1" fill="#64a0ff" opacity="0">
    <animate attributeName="opacity" values="0;0.55;0" dur="5.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="550" cy="370" r="0.7" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite" begin="3s"/>
  </circle>
  <circle cx="700" cy="350" r="1" fill="#ff8c32" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite" begin="2.5s"/>
  </circle>

  <!-- Brand: TANDEV -->
  <text x="450" y="55" text-anchor="middle" fill="rgba(255,255,255,0.45)"
        font-size="13" font-weight="700" letter-spacing="0.35em">TANDEV</text>

  <!-- Decorative line under brand -->
  <line x1="410" y1="68" x2="490" y2="68" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  <!-- Giant headline: THAI TAN -->
  <text x="450" y="168" text-anchor="middle" fill="url(#gh)"
        font-size="90" font-weight="800" letter-spacing="-0.02em">THAI TAN</text>

  <!-- Decorative gradient line under headline -->
  <rect x="150" y="188" width="600" height="0.5" rx="0.25" fill="url(#gd)"/>

  <!-- Subtitle -->
  <text x="450" y="228" text-anchor="middle" fill="#fff"
        font-size="20" font-weight="600" letter-spacing="-0.01em">Full-Stack Developer &amp; Visual Creator</text>

  <!-- Description -->
  <text x="450" y="262" text-anchor="middle" fill="rgba(255,255,255,0.6)"
        font-size="13" font-weight="400">Crafting production-grade web applications with clean architecture,</text>
  <text x="450" y="280" text-anchor="middle" fill="rgba(255,255,255,0.6)"
        font-size="13" font-weight="400">modern tooling, and a passion for visual storytelling.</text>

  <!-- Glass button -->
  <rect x="355" y="304" width="190" height="42" rx="10"
        fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="450" y="330" text-anchor="middle" fill="rgba(255,255,255,0.88)"
        font-size="12" font-weight="600" letter-spacing="0.06em">EXPLORE WORK  ↗</text>

  <!-- Bottom accent line -->
  <rect x="0" y="415" width="900" height="5" fill="url(#gd)" opacity="0.4"/>
</svg>