          <ellipse cx="694" cy="155" rx="168" ry="47" stroke-width="14" opacity=".6"/>
          <ellipse cx="694" cy="155" rx="166" ry="46.5" stroke-width="2" opacity=".65"/>
          <ellipse cx="694" cy="155" rx="157" ry="43" stroke-width="2.5" opacity=".62"/>
          <ellipse cx="694" cy="155" rx="150" ry="40" stroke-width="4" opacity=".4"/>
          <ellipse cx="694" cy="155" rx="142" ry="37" stroke-width="1.2" opacity=".5"/>
        </g>
        <circle cx="694" cy="155" r="94" fill="url(#hero-surface)"/>
        <g clip-path="url(#hero-globe)" fill="none">
