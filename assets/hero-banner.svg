          <path d="M544 155A150 40 0 0 0 844 155" stroke-width="4" opacity=".6"/>
          <path d="M552 155A142 37 0 0 0 836 155" stroke-width="1.2" opacity=".75"/>
          <path d="M521 163C540 191 607 203 672 203" stroke="#f5e5f3" stroke-width="1" opacity=".75"/>
