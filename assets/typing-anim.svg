<svg xmlns="http://www.w3.org/2000/svg" width="600" height="54" viewBox="0 0 600 54" role="img" aria-labelledby="typing-title">
  <title id="typing-title">Sekhmet Solar Leo — Developer CLI Terminal — Three.js &amp; WebGL Architect</title>
  <defs>
    <style>
      text{font-family:ui-monospace,Consolas,'Courier New',monospace;font-size:13.5px;font-weight:600;fill:#ffd700}
      .secondary-text{fill:#a0b0c0;font-size:11px}
      .typing-line{opacity:0}
      .typing-l1{animation:typing-s1 25s linear 0s 200}
      .typing-l2{animation:typing-s2 25s linear 0s 200}
      .typing-l3{animation:typing-s3 25s linear 0s 200}
      .typing-l4{animation:typing-s4 25s linear 0s 200}
      .typing-l5{animation:typing-s5 25s linear 0s 200}
      .typing-cur{animation:typing-blink 1s step-end 0s 5000}
      
      @keyframes typing-s1{0%,2%{opacity:0}3%,17%{opacity:1}18%,100%{opacity:0}}
      @keyframes typing-s2{0%,22%{opacity:0}23%,37%{opacity:1}38%,100%{opacity:0}}
      @keyframes typing-s3{0%,42%{opacity:0}43%,57%{opacity:1}58%,100%{opacity:0}}
      @keyframes typing-s4{0%,62%{opacity:0}63%,77%{opacity:1}78%,100%{opacity:0}}
      @keyframes typing-s5{0%,82%{opacity:0}83%,97%{opacity:1}98%,100%{opacity:0}}
      @keyframes typing-blink{0%,100%{opacity:1}50%{opacity:0}}
      
      @media(prefers-color-scheme:light){text{fill:#b86914}.typing-cur-r{fill:#b86914}}
      @media(prefers-reduced-motion:reduce){.typing-line,.typing-cur{animation:none}.typing-l1{opacity:1}.typing-l2,.typing-l3,.typing-l4,.typing-l5{display:none}}
      @media(forced-colors:active){text{fill:CanvasText}.typing-cur-r{fill:CanvasText}}
    </style>
  </defs>

  <!-- Terminal Window Background & Header -->
  <rect x=".5" y=".5" width="599" height="53" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="0" width="600" height="22" rx="10" fill="#161b22"/>
  <rect x="0" y="10" width="600" height="12" fill="#161b22"/>
  
  <!-- Terminal Window Dots -->
  <circle cx="16" cy="11" r="4" fill="#ff5f56"/>
  <circle cx="28" cy="11" r="4" fill="#ffbd2e"/>
  <circle cx="40" cy="11" r="4" fill="#27c93f"/>
  <text x="52" y="14" class="secondary-text">tan@solarlion:~ (zsh)</text>

  <!-- CLI Lines -->
  <text class="typing-line typing-l1" x="16" y="40">$ npx sekhmet-dev --zodiac=leo --date=18/8</text>
  <text class="typing-line typing-l2" x="16" y="40">&gt; Initializing Three.js r128 &amp; GSAP 3.12 WebGL...</text>
  <text class="typing-line typing-l3" x="16" y="40">&gt; Status: Frontend Architect &amp; Fullstack Artisan</text>
  <text class="typing-line typing-l4" x="16" y="40">&gt; Core Stack: JavaScript (ES6+), Vue, Node.js, WebGL</text>
  <text class="typing-line typing-l5" x="16" y="40">&gt; Divine Solar Code Burns Bright</text>
  <rect class="typing-cur typing-cur-r" x="420" y="27" width="8" height="16" rx="1" fill="#ffd700" opacity=".85"/>
</svg>
