<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150" preserveAspectRatio="xMidYMid meet" role="img" style="max-width:100%;height:auto">
  <defs>
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text{font-family:ui-monospace,Consolas,'Courier New',monospace;font-size:14px;font-weight:700}
      .l1{animation:a1 15s steps(1) infinite}
      .l2{animation:a2 15s steps(1) infinite}
      .l3{animation:a3 15s steps(1) infinite}
      .l4{animation:a4 15s steps(1) infinite}
      .l5{animation:a5 15s steps(1) infinite}
      .load{animation:aload 15s linear infinite; fill:#ffd700}
      @keyframes a1{0%,10%{opacity:0}11%,100%{opacity:1}}
      @keyframes a2{0%,20%{opacity:0}21%,100%{opacity:1}}
      @keyframes a3{0%,30%{opacity:0}31%,100%{opacity:1}}
      @keyframes a4{0%,60%{opacity:0}61%,100%{opacity:1}}
      @keyframes a5{0%,70%{opacity:0}71%,100%{opacity:1}}
      @keyframes aload{ 0%,30%{width:0} 30%,60%{width:200px} 60%,100%{width:300px} }
    </style>
  </defs>

  <!-- V8 Background Particles -->
  <g filter="url(#glow)">
    <circle cx="100" cy="140" r="1.5" fill="#ffd700"><animate attributeName="cy" values="140; 0" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="140" r="1" fill="#ff7700"><animate attributeName="cy" values="140; 0" dur="15s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="15s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="140" r="2" fill="#ffffff"><animate attributeName="cy" values="140; 0" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="140" r="1.5" fill="#ffd700"><animate attributeName="cy" values="140; 0" dur="12s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="12s" begin="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Massive Glass Terminal -->
  <rect x="2" y="2" width="796" height="146" rx="16" fill="#030612" stroke="#ff7700" stroke-width="2" filter="url(#glass)" opacity="0.8"/>
  <rect x="2" y="2" width="796" height="30" rx="16" fill="#0d1117"/>
  <rect x="2" y="16" width="796" height="16" fill="#0d1117"/>
  
  <circle cx="25" cy="17" r="6" fill="#ff5f56" filter="url(#glow)"/>
  <circle cx="45" cy="17" r="6" fill="#ffbd2e" filter="url(#glow)"/>
  <circle cx="65" cy="17" r="6" fill="#27c93f" filter="url(#glow)"/>
  <text x="90" y="22" fill="#7d8590" font-size="12">root@v8-sekhmet-engine:~ (bash) - 100x40</text>

  <!-- CLI Output -->
  <g transform="translate(25, 55)" filter="url(#glow)">
    <text class="l1" y="0" fill="#ff7700">$ sudo systemctl start 3d-matrix-engine</text>
    <text class="l2" y="22" fill="#ffd700">&gt; Allocating WebGL context... OK</text>
    <text class="l3" y="44" fill="#a0b0c0">&gt; Compiling Solar Flare Shaders: </text>
    <rect class="l3 load" x="250" y="34" height="12" rx="2" fill="#ffd700"/>
    <text class="l3" x="250" y="44" fill="#1e180a">[████████████████████████] 100%</text> 
    <text class="l4" y="66" fill="#27c93f">&gt; SUCCESS: Neural 3D Network Online.</text>
    <text class="l5" y="88" fill="#ffd700">tan@leo:~$ <tspan fill="#ffffff">Welcome to V8 Omniverse.</tspan></text>
  </g>
</svg>
