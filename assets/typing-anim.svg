<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120"
     preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="tt"
     style="max-width:100%;height:auto">
  <title id="tt">Terminal — developer identity</title>

  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c32" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#64a0ff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace; }
  </style>

  <!-- Frame -->
  <rect width="800" height="120" rx="12" fill="#111113" stroke="url(#tb)" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="800" height="32" rx="12" fill="#18181b"/>
  <rect y="24" width="800" height="8" fill="#18181b"/>

  <!-- Window dots -->
  <circle cx="22" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="5" fill="#febc2e"/>
  <circle cx="58" cy="16" r="5" fill="#28c840"/>

  <!-- Title text -->
  <text x="400" y="20" text-anchor="middle" fill="rgba(255,255,255,0.35)"
        font-size="11" font-weight="400">tandev — bash</text>

  <!-- Command line -->
  <text x="22" y="62" font-size="13" font-weight="600">
    <tspan fill="#ff8c32">❯</tspan>
    <tspan fill="rgba(255,255,255,0.88)" dx="8">whoami</tspan>
  </text>

  <!-- Output -->
  <text x="22" y="88" font-size="12" font-weight="400">
    <tspan fill="rgba(255,255,255,0.4)">→</tspan>
    <tspan fill="rgba(255,255,255,0.62)" dx="8">Duong Thai Tan · Full-Stack Developer · Soc Trang, Vietnam</tspan>
  </text>

  <!-- Blinking cursor -->
  <rect x="42" y="96" width="8" height="14" rx="1" fill="#ff8c32" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
