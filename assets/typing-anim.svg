<svg xmlns="http://www.w3.org/2000/svg" width="600" height="70" viewBox="0 0 600 70" role="img" aria-labelledby="typing-title">
  <title id="typing-title">Sekhmet Solar Leo — Developer CLI Terminal — 3D Architect</title>
  <defs>
    <filter id="glass">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="terminal-sweep" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#ffd700" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#30363d" />
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>
    <style>
      text{font-family:ui-monospace,Consolas,'Courier New',monospace;font-size:13.5px;font-weight:700;fill:#ffd700}
      .secondary-text{fill:#a0b0c0;font-size:11.5px;font-weight:600}
      .typing-line{opacity:0}
      .typing-l1{animation:typing-s1 25s linear 0s 200}
      .typing-l2{animation:typing-s2 25s linear 0s 200}
      .typing-l3{animation:typing-s3 25s linear 0s 200}
      .typing-l4{animation:typing-s4 25s linear 0s 200}
      .typing-l5{animation:typing-s5 25s linear 0s 200}
      .typing-cur{animation:typing-blink 1s step-end 0s 5000}
      
      @keyframes typing-s1{0%,2%{opacity:0}3%,17%{opacity:1}18%,100%{opacity:0}}
      @keyframes typing-s2{0%,22%{opacity:0}23%,37%{opacity:1}38%,100%{opacity:0}}
      @keyframes typing-s3{0%,42%{opacity:0}43%,57%{opacity:1}58%,100%{opacity:0}}
      @keyframes typing-s4{0%,62%{opacity:0}63%,77%{opacity:1}78%,100%{opacity:0}}
      @keyframes typing-s5{0%,82%{opacity:0}83%,97%{opacity:1}98%,100%{opacity:0}}
      @keyframes typing-blink{0%,100%{opacity:1}50%{opacity:0}}
      @media(prefers-reduced-motion:reduce){.typing-line,.typing-cur{animation:none}.typing-l1{opacity:1}.typing-l2,.typing-l3,.typing-l4,.typing-l5{display:none}}
    </style>
  </defs>

  <!-- 3D Glass Terminal Background -->
  <rect x="2" y="2" width="596" height="66" rx="12" fill="#090c10" stroke="url(#terminal-sweep)" stroke-width="2" filter="url(#glass)"/>
  <rect x="2" y="2" width="596" height="24" rx="12" fill="#161b22"/>
  <rect x="2" y="14" width="596" height="12" fill="#161b22"/>
  
  <!-- Terminal Buttons with Glow -->
  <circle cx="20" cy="14" r="4.5" fill="#ff5f56" filter="url(#neon-glow)"/>
  <circle cx="34" cy="14" r="4.5" fill="#ffbd2e" filter="url(#neon-glow)"/>
  <circle cx="48" cy="14" r="4.5" fill="#27c93f" filter="url(#neon-glow)"/>
  <text x="64" y="18" class="secondary-text">root@sekhmet-solar-engine:~ (zsh)</text>

  <!-- Animated CLI Lines -->
  <g filter="url(#neon-glow)">
    <text class="typing-line typing-l1" x="20" y="48">$ npx sekhmet-dev --zodiac=leo --mode=3d-parallax</text>
    <text class="typing-line typing-l2" x="20" y="48">&gt; Initializing Three.js r128 &amp; GSAP 3.12 WebGL...</text>
    <text class="typing-line typing-l3" x="20" y="48">&gt; Status: Ultimate 3D Frontend Architect</text>
    <text class="typing-line typing-l4" x="20" y="48">&gt; Injecting Solar Fire and Glassmorphism Shaders...</text>
    <text class="typing-line typing-l5" x="20" y="48">&gt; Divine Solar Code Burns Bright 🦁🔥</text>
    <rect class="typing-cur" x="430" y="36" width="9" height="15" rx="1.5" fill="#ffd700"/>
  </g>
</svg>
