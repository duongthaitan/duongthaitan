<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40" preserveAspectRatio="none" role="presentation">
  <defs>
    <filter id="glow-divider" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Core Laser Line -->
  <rect x="0" y="9" width="900" height="2" fill="#00ff00" filter="url(#glow-divider)">
    <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite" />
  </rect>

  <!-- Scanning Bright Spot -->
  <rect x="0" y="8" width="100" height="4" fill="#00ffcc" filter="url(#glow-divider)">
    <animate attributeName="x" values="-100; 900" dur="3s" repeatCount="indefinite" />
  </rect>

