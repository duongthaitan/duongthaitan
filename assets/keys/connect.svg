<svg xmlns="http://www.w3.org/2000/svg" width="160" height="50" viewBox="0 0 160 50" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="nav-connect-title nav-connect-desc" style="max-width:100%;height:auto">
<title id="nav-connect-title">Go to ~/connect</title>
<desc id="nav-connect-desc">A 3D key labelled ~/connect.</desc>
<style>:root{--bg:#0d1117;--raised:rgba(255,255,255,.045);--panel:rgba(22,27,34,.92);--screen:rgba(1,4,9,.55);--fg:#e6edf3;--muted:#9198a1;--faint:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--accent:#7ee787;--glow:#d2ffd6;--deep:#2ea043;--teal:#39c5cf;--blue:#79c0ff;--vox:#2d333b;--red:#ff7b72;--yellow:#e3b341}
@media (prefers-color-scheme:light){:root{--bg:#ffffff;--raised:rgba(31,35,40,.035);--panel:rgba(255,255,255,.95);--screen:rgba(246,248,250,.9);--fg:#1f2328;--muted:#59636e;--faint:rgba(31,35,40,.07);--line:rgba(31,35,40,.15);--accent:#1a7f37;--glow:#4ac26b;--deep:#0f5323;--teal:#1b7c83;--blue:#0969da;--vox:#8c959f;--red:#cf222e;--yellow:#9a6700}}
text{font-family:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--fg)}
.fg{fill:var(--fg)}.ac{fill:var(--accent)}
.shs{stop-color:var(--accent)}
.pop,.ring,.chip,.spin,.tick{transform-box:fill-box;transform-origin:center}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
@keyframes sweep{0%{transform:translateX(0);animation-timing-function:cubic-bezier(.77,0,.175,1)}38%,100%{transform:translateX(var(--d))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (forced-colors:active){text,.fg,.mu,.ac,.fa,.rs{fill:CanvasText}}</style>
<defs><clipPath id="nav-connect-key"><rect width="155" height="45" rx="10"/></clipPath><linearGradient id="nav-connect-sheen"><stop offset="0" class="shs" stop-opacity="0"/><stop offset=".5" class="shs" stop-opacity=".22"/><stop offset="1" class="shs" stop-opacity="0"/></linearGradient>
<style>.kb{fill:var(--line)}.ks{fill:var(--faint)}.face{fill:var(--raised);stroke:var(--line)}@keyframes pop3d{from{transform:translate(5px,5px)}}</style></defs>
<path class="kb" d="M9.5 44.5L145.5 44.5L150.5 49.5L14.5 49.5Z"/><path class="ks" d="M154.5 9.5L159.5 14.5L159.5 40.5L154.5 35.5Z"/>
<g style="animation:pop3d 6000ms linear(0, 0 11.8%, 0.32 12.6%, 0.66 13.8%, 0.91 15.7%, 1 22.2%, 1 100%) 0ms infinite alternate both">
<path class="face" d="M10.5 0.5H144.5A10 10 0 0 1 154.5 10.5V34.5A10 10 0 0 1 144.5 44.5H10.5A10 10 0 0 1 0.5 34.5V10.5A10 10 0 0 1 10.5 0.5Z"/>
<g clip-path="url(#nav-connect-key)"><g transform="skewX(-20)"><rect x="-90" y="0" width="60" height="50" fill="url(#nav-connect-sheen)" style="--d:320px;animation:sweep 5200ms linear 1610ms infinite"/></g></g>
<g class="pop" style="animation:pop 6000ms linear(0, 0 14.8%, 0.32 15.4%, 0.66 16.2%, 0.91 17.5%, 1 21.8%, 1 100%) 0ms infinite alternate both"><path class="ac" transform="translate(14 14.5) scale(0.0625)" d="M128 24a104 104 0 1 0 104 104a104 104 0 0 0-104-104zm0 16a88 88 0 0 1 48 14v20l-22 26l-32 4l0 0l-20-13a16 16 0 0 0-22 4l-21 31a16 16 0 0 0-3 9l0 36l-3 3a88 88 0 0 1 75-134zm-66 146l3-1a16 16 0 0 0 7-13l0-37l21-31a4 4 0 0 0 0 0l20 13a16 16 0 0 0 12 3l31-4a16 16 0 0 0 10-6l22-26a16 16 0 0 0 4-10v-6a88 88 0 0 1 20 87l-16-15a16 16 0 0 0-17-3l-31 13a16 16 0 0 0-9 12l-3 17a16 16 0 0 0 12 17l21 6l3 2a88 88 0 0 1-110-18zm123 9l-4-4a16 16 0 0 0-8-4l-21-6l2-16l31-13l20 18a88 88 0 0 1-20 25z"/></g>
<text x="38" y="26.5" font-size="13" textLength="70.2" class="fg" style="animation:up 6000ms linear(0, 0 16.2%, 0.32 16.8%, 0.66 17.7%, 0.91 19.2%, 1 24.2%, 1 100%) 0ms infinite alternate both">~/connect</text>
</g>
</svg>
