<text x="46" y="42" font-size="13" textLength="117" class="ac" style="animation:up 6000ms linear(0, 0 11.8%, 0.32 12.5%, 0.66 13.3%, 0.91 14.8%, 1 19.8%, 1 100%) 0ms infinite alternate both">@thaitan.duong_</text>
