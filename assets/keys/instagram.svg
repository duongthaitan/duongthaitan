<g style="animation:pop3d 6000ms linear(0, 0 6.3%, 0.32 7.1%, 0.66 8.3%, 0.91 10.2%, 1 16.7%, 1 100%) 0ms infinite alternate both">
<path class="face" d="M10.5 0.5H272.5A10 10 0 0 1 282.5 10.5V48.5A10 10 0 0 1 272.5 58.5H10.5A10 10 0 0 1 0.5 48.5V10.5A10 10 0 0 1 10.5 0.5Z"/>
<g clip-path="url(#link-instagram-key)"><g transform="skewX(-20)"><rect x="-90" y="0" width="60" height="64" fill="url(#link-instagram-sheen)" style="--d:448px;animation:sweep 5200ms linear 1280ms infinite"/></g></g>
<g class="pop" style="animation:pop 6000ms linear(0, 0 9.3%, 0.32 9.9%, 0.66 10.7%, 0.91 12%, 1 16.3%, 1 100%) 0ms infinite alternate both"><path class="ac" transform="translate(14 17.5) scale(0.0938)" d="M128 80a48 48 0 1 0 48 48a48 48 0 0 0-48-48zm0 80a32 32 0 1 1 32-32a32 32 0 0 1-32 32zm48-136h-96a56 56 0 0 0-56 56v96a56 56 0 0 0 56 56h96a56 56 0 0 0 56-56v-96a56 56 0 0 0-56-56zm40 152a40 40 0 0 1-40 40h-96a40 40 0 0 1-40-40v-96a40 40 0 0 1 40-40h96a40 40 0 0 1 40 40zm-24-100a12 12 0 1 1-12-12a12 12 0 0 1 12 12z"/></g>
