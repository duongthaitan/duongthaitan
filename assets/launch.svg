<g style="animation:side 7000ms linear(0, 0 23.7%, 0.32 24.3%, 0.66 25.1%, 0.91 26.5%, 1 31.1%, 1 100%) 0ms infinite alternate both"><text x="589.8" y="45" font-size="13" textLength="226.2" class="mu">open the interactive terminal</text><rect class="ek" x="826" y="24" width="40" height="28" rx="6"/><path class="tick" d="M846 33v9h-16m0 0l5 -5m-5 5l5 5"/></g>
