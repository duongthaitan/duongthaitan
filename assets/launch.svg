<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="launch-title launch-desc" style="max-width:100%;height:auto">
<title id="launch-title">Open the interactive 3D terminal</title>
<desc id="launch-desc">A 3D key that types ./terminal --interactive --3d and invites a click to open the interactive terminal page, where you can type commands, tilt the terminal and press the tool keys.</desc>
<style>
:root{--bg:#0d1117;--raised:rgba(255,255,255,.045);--panel:rgba(22,27,34,.92);--screen:rgba(1,4,9,.55);--fg:#e6edf3;--muted:#9198a1;--faint:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--accent:#7ee787;--glow:#d2ffd6;--deep:#2ea043;--teal:#39c5cf;--blue:#79c0ff;--vox:#2d333b}
@media (prefers-color-scheme:light){:root{--bg:#ffffff;--raised:rgba(31,35,40,.035);--panel:rgba(255,255,255,.95);--screen:rgba(246,248,250,.9);--fg:#1f2328;--muted:#59636e;--faint:rgba(31,35,40,.07);--line:rgba(31,35,40,.15);--accent:#1a7f37;--glow:#4ac26b;--deep:#0f5323;--teal:#1b7c83;--blue:#0969da;--vox:#8c959f}}
text{font-family:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--fg)}
.fg{fill:var(--fg)}.mu{fill:var(--muted)}.ac{fill:var(--accent)}.bg{fill:var(--bg)}.fa{fill:var(--faint)}.rs{fill:var(--raised)}
.frame{fill:var(--raised);stroke:var(--line)}.xa{fill:var(--line)}.xb{fill:var(--faint)}
.hair{fill:none;stroke:var(--line)}
.chev,.tick{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shs{stop-color:var(--accent)}
.pop,.ring,.chip,.spin,.tick{transform-box:fill-box;transform-origin:center}
.grow,.run{transform-box:fill-box;transform-origin:0 50%}
.draw{stroke-dasharray:1 1}
.mv{transform:translateX(var(--d))}
.cv,.cvs{transform-box:fill-box;transform-origin:100% 50%}.cv{transform:scaleX(0)}
.ring{fill:none;stroke:var(--accent);stroke-width:1.5}
.spin{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.beam{fill:none;stroke:var(--accent)}
.ring,.run,.spin,.beam,.pk,.flash,.fr,.off{opacity:0}
.px{opacity:.55;--o:.55}
@keyframes in{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes side{from{opacity:0;transform:translateX(-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(var(--rise))}}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
@keyframes chip{from{opacity:0;transform:translateY(6px) scale(.96)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes type{from{transform:translateX(0)}}
@keyframes wipe{from{transform:scaleX(1)}}
@keyframes ch{from{fill-opacity:0}}
@keyframes vanish{to{opacity:0}}
@keyframes blink{0%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes ring{0%{opacity:.55;transform:scale(1)}45%,100%{opacity:0;transform:scale(3)}}
@keyframes run{0%{opacity:1;transform:scaleX(0)}75%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}
@keyframes show{from,to{opacity:1}}
@keyframes spin{from{opacity:1;transform:rotate(0)}to{opacity:1;transform:rotate(360deg)}}
@keyframes sweep{0%{transform:translateX(0);animation-timing-function:cubic-bezier(.77,0,.175,1)}38%,100%{transform:translateX(var(--d))}}
@keyframes orbit{from{stroke-dashoffset:var(--o0)}to{stroke-dashoffset:var(--o1)}}
@keyframes beamfade{0%{opacity:0}6%,94%{opacity:var(--bo)}100%{opacity:0}}
@keyframes glint{8%{opacity:1}26%{opacity:var(--o)}}
@keyframes glintT{8%{fill:var(--glow)}26%{fill:var(--accent)}}
@keyframes descend{0%{opacity:0;transform:translateY(0)}4%,52%{opacity:1}56%,100%{opacity:0;transform:translateY(var(--d))}}
@keyframes flash{0%{opacity:0}5%{opacity:.22}24%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.transient,.fx{display:none}}
@media (forced-colors:active){text,.fg,.mu,.ac,.fa,.rs{fill:CanvasText}.frame,.bg{fill:Canvas}.frame,.hair{stroke:CanvasText}.chev,.tick{stroke:CanvasText}}
</style>
<defs><style>.kb{fill:var(--line)}.ks{fill:var(--faint)}.face{fill:var(--raised);stroke:var(--accent);stroke-opacity:.55}.pulse{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}.ek{fill:var(--raised);stroke:var(--line)}
@keyframes pulse{0%,100%{opacity:0}45%{opacity:.85}}</style></defs>
<path class="kb" d="M12.5 76.5L880.5 76.5L887.5 83.5L19.5 83.5Z"/><path class="ks" d="M892.5 12.5L899.5 19.5L899.5 71.5L892.5 64.5Z"/>
<path class="face" d="M13.5 0.5H879.5A13 13 0 0 1 892.5 13.5V63.5A13 13 0 0 1 879.5 76.5H13.5A13 13 0 0 1 0.5 63.5V13.5A13 13 0 0 1 13.5 0.5Z"/>
<path class="pulse" d="M13.5 0.5H879.5A13 13 0 0 1 892.5 13.5V63.5A13 13 0 0 1 879.5 76.5H13.5A13 13 0 0 1 0.5 63.5V13.5A13 13 0 0 1 13.5 0.5Z" style="animation:pulse 2600ms cubic-bezier(.77,0,.175,1) 1660ms 4"/>
<path class="ac" transform="translate(26 29) scale(0.0859)" d="M128 128a8 8 0 0 1-3 6l-40 32a8 8 0 1 1-10-12l32-26l-32-26a8 8 0 1 1 10-12l40 32a8 8 0 0 1 3 6zm48 24h-40a8 8 0 0 0 0 16h40a8 8 0 0 0 0-16zm56-96v144a16 16 0 0 1-16 16h-176a16 16 0 0 1-16-16v-144a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16zm-16 144v-144h-176v144h176z" style="animation:pop 360ms cubic-bezier(.23,1,.32,1) 40ms both"/>
<path class="chev" d="M62 34.1l5.44 5.44l-5.44 5.44" style="animation:in 240ms cubic-bezier(.23,1,.32,1) 80ms both"/>
<text x="86" y="46" font-size="17" textLength="295.8" class="fg"><tspan style="animation:ch 1ms linear 340ms both">.</tspan><tspan style="animation:ch 1ms linear 380ms both">/</tspan><tspan style="animation:ch 1ms linear 420ms both">t</tspan><tspan style="animation:ch 1ms linear 460ms both">e</tspan><tspan style="animation:ch 1ms linear 500ms both">r</tspan><tspan style="animation:ch 1ms linear 540ms both">m</tspan><tspan style="animation:ch 1ms linear 580ms both">i</tspan><tspan style="animation:ch 1ms linear 620ms both">n</tspan><tspan style="animation:ch 1ms linear 660ms both">a</tspan><tspan style="animation:ch 1ms linear 700ms both">l</tspan> <tspan style="animation:ch 1ms linear 780ms both">-</tspan><tspan style="animation:ch 1ms linear 820ms both">-</tspan><tspan style="animation:ch 1ms linear 860ms both">i</tspan><tspan style="animation:ch 1ms linear 900ms both">n</tspan><tspan style="animation:ch 1ms linear 940ms both">t</tspan><tspan style="animation:ch 1ms linear 980ms both">e</tspan><tspan style="animation:ch 1ms linear 1020ms both">r</tspan><tspan style="animation:ch 1ms linear 1060ms both">a</tspan><tspan style="animation:ch 1ms linear 1100ms both">c</tspan><tspan style="animation:ch 1ms linear 1140ms both">t</tspan><tspan style="animation:ch 1ms linear 1180ms both">i</tspan><tspan style="animation:ch 1ms linear 1220ms both">v</tspan><tspan style="animation:ch 1ms linear 1260ms both">e</tspan> <tspan style="animation:ch 1ms linear 1340ms both">-</tspan><tspan style="animation:ch 1ms linear 1380ms both">-</tspan><tspan style="animation:ch 1ms linear 1420ms both">3</tspan><tspan style="animation:ch 1ms linear 1460ms both">d</tspan></text><rect class="ac mv" x="87" y="32.06" width="8.5" height="17.34" rx="1" style="--d:295.8px;animation:in 1ms linear 300ms both,type 1160ms steps(29,end) 300ms both,blink 1100ms linear 1700ms 6"/>
<g style="animation:side 520ms cubic-bezier(.23,1,.32,1) 1660ms both"><text x="589.8" y="45" font-size="13" textLength="226.2" class="mu">open the interactive terminal</text><rect class="ek" x="826" y="24" width="40" height="28" rx="6"/><path class="tick" d="M846 33v9h-16m0 0l5 -5m-5 5l5 5"/></g>
</svg>
