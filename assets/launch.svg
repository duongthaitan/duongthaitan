<path class="face" d="M13.5 0.5H879.5A13 13 0 0 1 892.5 13.5V63.5A13 13 0 0 1 879.5 76.5H13.5A13 13 0 0 1 0.5 63.5V13.5A13 13 0 0 1 13.5 0.5Z"/>
<path class="pulse" d="M13.5 0.5H879.5A13 13 0 0 1 892.5 13.5V63.5A13 13 0 0 1 879.5 76.5H13.5A13 13 0 0 1 0.5 63.5V13.5A13 13 0 0 1 13.5 0.5Z" style="animation:pulse 2600ms cubic-bezier(.77,0,.175,1) 1660ms infinite"/>
<path class="ac" transform="translate(26 29) scale(0.0859)" d="M128 128a8 8 0 0 1-3 6l-40 32a8 8 0 1 1-10-12l32-26l-32-26a8 8 0 1 1 10-12l40 32a8 8 0 0 1 3 6zm48 24h-40a8 8 0 0 0 0 16h40a8 8 0 0 0 0-16zm56-96v144a16 16 0 0 1-16 16h-176a16 16 0 0 1-16-16v-144a16 16 0 0 1 16-16h176a16 16 0 0 1 16 16zm-16 144v-144h-176v144h176z" style="animation:pop 7000ms linear(0, 0 0.6%, 0.32 1%, 0.66 1.5%, 0.91 2.5%, 1 5.7%, 1 100%) 0ms infinite alternate both"/>
