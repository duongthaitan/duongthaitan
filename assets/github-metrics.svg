      <rect class="tile-glow" width="552" height="140" rx="18" fill="none" stroke="url(#metrics-halo)" stroke-width="2" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" begin="1.5s" repeatCount="indefinite" />
