      </ellipse>
      <ellipse cx="344" cy="346" rx="356" ry="214" transform="rotate(-35 344 346)">
        <animateTransform attributeName="transform" type="rotate" from="-35 344 346" to="-395 344 346" dur="90s" repeatCount="indefinite" />
