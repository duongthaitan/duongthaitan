<svg xmlns="http://www.w3.org/2000/svg" width="900" height="232" viewBox="0 0 900 232" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="metrics-title metrics-desc" style="max-width:100%;height:auto">
