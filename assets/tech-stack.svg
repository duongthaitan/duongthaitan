<svg xmlns="http://www.w3.org/2000/svg" width="500" height="150" viewBox="0 0 500 150" preserveAspectRatio="xMidYMid meet" role="img">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .tech-item { cursor: pointer; transition: all 0.3s; }
    .tech-item:hover .core-box { stroke: #ffffff; fill: #1a0a00; }
    .tech-item:hover .core-fill { opacity: 0.3; }
    .tech-item:hover text { fill: #ffffff; }
  </style>
  <rect width="500" height="150" fill="none"/>
  
    <g class="tech-item" transform="translate(0, 0)">
      <!-- Glow Ripple -->
      <rect x="5" y="5" width="115" height="65" rx="10" fill="none" stroke="#F7DF1E" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0; 0.5; 0" dur="2s" begin="0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="1; 1.1; 1" dur="2s" begin="0s" repeatCount="indefinite" transform-origin="62.5 37.5"/>
      </rect>
      
      <!-- Tech Badge Core -->
      <rect class="core-box" x="10" y="10" width="105" height="55" rx="6" fill="#0d1117" stroke="#F7DF1E" stroke-width="1.5" filter="url(#glow)"/>
      <rect class="core-fill" x="10" y="10" width="105" height="55" rx="6" fill="#F7DF1E" opacity="0.1"/>
      
      <!-- Tech Label -->
      <text x="62.5" y="42.5" fill="#F7DF1E" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="800" filter="url(#glow)">JavaScript</text>
    </g>
  
