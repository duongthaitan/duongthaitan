<linearGradient id="brand-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a505a"/><stop offset=".35" stop-color="#2b3038"/><stop offset="1" stop-color="#15181d"/></linearGradient>
<linearGradient id="brand-grip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2e3339"/><stop offset=".55" stop-color="#1a1d22"/><stop offset="1" stop-color="#0d0f12"/></linearGradient>
<pattern id="brand-leather" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".55" fill="#fff" fill-opacity=".07"/></pattern>
<radialGradient id="brand-metal" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#d9dee5"/><stop offset=".45" stop-color="#8a929c"/><stop offset="1" stop-color="#3a4048"/></radialGradient>
<linearGradient id="brand-barrel" gradientUnits="userSpaceOnUse" x1="70" y1="70" x2="104" y2="116"><stop offset="0" stop-color="#4c535d"/><stop offset=".45" stop-color="#1d2026"/><stop offset="1" stop-color="#0b0d10"/></linearGradient>
<radialGradient id="brand-rim" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#5b626c"/><stop offset=".6" stop-color="#22262c"/><stop offset="1" stop-color="#0c0e11"/></radialGradient>
<radialGradient id="brand-glass" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#1d3a63"/><stop offset=".45" stop-color="#0a1426"/><stop offset="1" stop-color="#020305"/></radialGradient>
<radialGradient id="brand-shadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="brand-flash"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="#fff6d8" stop-opacity=".35"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
<style>.sht{stop-color:var(--teal)}.cb-top{fill:#565d67}.cb-side{fill:#14171b}.cb-edge{fill:none;stroke:#fff;stroke-opacity:.07}.cb-hl{stroke:#fff;stroke-opacity:.1;stroke-linecap:round}
.led{fill:#ff5a4f}.af{fill:#e3b341;opacity:.85}.shoe{fill:#0f1114}.rail{stroke:#9aa3ad;stroke-width:.6;stroke-opacity:.7}.brandtxt{fill:#aeb6c0}
.dial{fill:#2a2e35}.dialtop{fill:#5d646e;stroke:#89919c;stroke-width:.6}.knurl{stroke:#0d0f12;stroke-width:5;stroke-dasharray:.8 1}
.btn{fill:#2a2e35}.btntop{fill:#c7ccd3;stroke:#ff5a4f;stroke-width:.7}
.barrel-back{fill:#1a1d22}.rubber{fill:none;stroke:#0c0e11;stroke-width:4.5;stroke-dasharray:1 1.4}
.focus{fill:none;stroke:#090a0c;stroke-width:6;stroke-dasharray:1.1 1.1}.redring{fill:none;stroke:#ff4b3e;stroke-width:1.6}
.rim{stroke:#6c737d;stroke-width:.6}.rim-in{fill:#06070a;stroke:#2c3138;stroke-width:.8}
.ct-violet{fill:none;stroke:#8f73ff;stroke-width:1.6;stroke-opacity:.55;stroke-linecap:round}.ct-green{fill:none;stroke:#3fd6a0;stroke-width:1.2;stroke-opacity:.42;stroke-linecap:round}
.ct-amber{fill:none;stroke:#ffb347;stroke-width:1.1;stroke-opacity:.5;stroke-linecap:round}
.blade{fill:#070a10;stroke:#273041;stroke-width:.5}.bladeline{stroke:#2b3547;stroke-width:.5}
.spec{fill:#fff;opacity:.75}.spec2{fill:#fff;opacity:.9}
.iris,.cshadow{transform-box:fill-box;transform-origin:center}
.flash,.glassflash{opacity:0}.glassflash{fill:#fff}
@keyframes turn{to{stroke-dashoffset:-22}}
@keyframes press{6%{transform:translateY(1.4px)}12%{transform:none}}
@keyframes iris{6%{transform:scale(1)}9%{transform:scale(.22)}15%{transform:scale(1)}}
@keyframes flash{8%{opacity:0}9.5%{opacity:1}20%{opacity:0}}
@keyframes flashglass{8%{opacity:0}9.5%{opacity:.55}16%{opacity:0}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes shb{50%{transform:scale(.88);opacity:.7}}
@keyframes blink{50%{opacity:.15}}
.wd1{fill:var(--teal);opacity:.5}.wd2{fill:var(--blue);opacity:.28}
@media (prefers-color-scheme:light){.wd1{opacity:.32}.wd2{opacity:.18}}
@keyframes extrude{from{opacity:0;transform:translate(var(--e),calc(var(--e) * -.7))}}</style></defs>
