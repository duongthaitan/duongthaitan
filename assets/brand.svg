<svg xmlns="http://www.w3.org/2000/svg" width="900" height="222" viewBox="0 0 900 222" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="brand-title brand-desc" style="max-width:100%;height:auto">
<title id="brand-title">tandev</title>
<desc id="brand-desc">The tandev brand mark: a silver Fujifilm X-T5 with a 25mm f/1.8 lens and a speedlight on the hot shoe, in 3D. Every few seconds it takes a picture: the shutter button half-presses (the AF lamp lights, the focus ring turns), then presses fully, the flash fires, the iris snaps shut and the body recoils, and the speedlight&apos;s ready lamp blinks red while it recycles, then turns green. Beside it, the wordmark tandev and the line Duong Thai Tan, full-stack developer, Soc Trang, Vietnam.</desc>
<style>:root{--bg:#0d1117;--raised:rgba(255,255,255,.045);--panel:rgba(22,27,34,.92);--screen:rgba(1,4,9,.55);--fg:#e6edf3;--muted:#9198a1;--faint:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--accent:#7ee787;--glow:#d2ffd6;--deep:#2ea043;--teal:#39c5cf;--blue:#79c0ff;--vox:#2d333b;--red:#ff7b72;--yellow:#e3b341}
