name: Regenerate static SVG assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate SVGs
        run: node scripts/gen-profile.mjs

      - name: Check generated SVGs
        run: node --test scripts/gen-profile.test.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m "chore: regenerate static SVG assets [skip ci]" || echo "No changes to commit"
          git push
